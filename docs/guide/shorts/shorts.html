<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>쇼츠 렌더러</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#eef2fb;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;color:#1b2333;word-break:keep-all}
#stage{position:relative;width:1080px;height:1920px;background:linear-gradient(180deg,#f6f8fd 0%,#e7edfa 100%);overflow:hidden}
#prog{position:absolute;left:0;top:0;height:10px;background:#2457d6;width:0;z-index:50}
#tag{position:absolute;left:70px;top:96px;display:flex;gap:16px;align-items:center;z-index:20}
#tag b{background:#1b2333;color:#fff;font-size:40px;padding:8px 26px;border-radius:99px;letter-spacing:.04em}
#tag span{font-size:38px;color:#586379;font-weight:700}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.hd{position:absolute;left:70px;right:70px;top:190px;text-align:center;font-size:84px;line-height:1.2;font-weight:900;letter-spacing:-.02em;color:#1b2333}
.hd em{font-style:normal;color:#2457d6}
.st{position:absolute;left:70px;right:70px;top:390px;height:930px}
.abs{position:absolute!important;left:0;right:0;top:0}
#cap{position:absolute;left:70px;right:70px;top:1350px;min-height:230px;display:flex;align-items:center;justify-content:center;background:rgba(15,23,41,.93);color:#fff;border-radius:36px;padding:36px 44px;text-align:center;font-size:56px;line-height:1.42;font-weight:700;opacity:0;z-index:30}
#intro{position:absolute;inset:0;background:#2457d6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;z-index:60;opacity:0;text-align:center;padding:0 80px}
#intro .n{font-size:300px;font-weight:900;line-height:1;letter-spacing:-.04em}
#intro .t{font-size:84px;font-weight:900;line-height:1.25}
[data-k]{opacity:0}
.card{background:#fff;border:3px solid #d5deef;border-radius:36px;padding:36px 40px;box-shadow:0 14px 40px -20px rgba(20,30,70,.35)}
.bad{background:#fdecea;border-color:#f3c6c2}.good{background:#e7f6ec;border-color:#bde3cb}
.lab{font-size:42px;font-weight:900;margin-bottom:14px}.bad .lab{color:#b42318}.good .lab{color:#15803d}
.tx{font-size:56px;line-height:1.35;font-weight:700}
.row{display:flex;gap:26px;align-items:stretch}.col{display:flex;flex-direction:column;gap:26px}
.pill{display:inline-block;background:#e8f0ff;color:#2457d6;border-radius:99px;padding:12px 34px;font-size:46px;font-weight:900}
.pill.o{background:#fdebd7;color:#9a4b05}.pill.r{background:#fdecea;color:#b42318}.pill.g{background:#e7f6ec;color:#15803d}
.code{background:#0f1729;color:#e8edff;border-radius:36px;padding:56px 56px;font-size:56px;line-height:1.5;font-weight:600;min-height:420px;box-shadow:0 20px 50px -22px rgba(0,0,0,.6)}
.code .bar{display:flex;gap:14px;margin-bottom:30px}.code .bar i{width:22px;height:22px;border-radius:50%;background:#3d4a6d;display:block}
.code small{display:block;font-size:36px;color:#8794b8;margin-bottom:24px;font-weight:700}
.big{font-size:150px;font-weight:900;letter-spacing:-.03em;line-height:1}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:52px;font-weight:700;background:#fff;border-radius:30px;overflow:hidden;border:3px solid #d5deef}
.tbl th{background:#f1f5fa;font-size:42px;color:#586379;padding:22px 30px;text-align:left}
.tbl td{padding:24px 30px;border-top:2px solid #e3e9f4}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.badge{position:absolute;right:0;top:-70px;background:#fff0cf;border:3px solid #edd7a2;color:#8a590c;font-size:40px;font-weight:900;border-radius:99px;padding:10px 30px}
.box3{display:flex;align-items:stretch;gap:12px}.box3 .b{flex:1;background:#fff;border:3px solid #d5deef;border-top:14px solid #d9730d;border-radius:30px;padding:30px 24px;text-align:center}
.box3 .b.p{border-top-color:#2457d6;background:#e8f0ff}.box3 .ar{display:flex;align-items:center;font-size:70px;font-weight:900;color:#586379}
.box3 em{display:block;font-style:normal;font-size:34px;font-weight:900;color:#d9730d;margin-bottom:10px}.box3 .p em{color:#2457d6}
.box3 b{display:block;font-size:54px;line-height:1.2;margin-bottom:10px}.box3 span{font-size:38px;color:#586379;line-height:1.35;display:block}
.dash{background:#fff;border:3px solid #cbd9ea;border-radius:34px;padding:30px;width:100%}
.dash .mt{font-size:38px;font-weight:900;margin-bottom:20px}
.g6{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g6 div{height:130px;border-radius:18px;color:#fff;font-weight:900;font-size:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.g6 small{font-size:28px;font-weight:700}
.pie{width:230px;height:230px;border-radius:50%;background:conic-gradient(#e8453c 0 24%,#2fa84f 0 43%,#8e44ad 0 60%,#f39c12 0 77%,#16a0c4 0 90%,#d35400 0)}
.hero{background:#e8f0ff;border:3px solid #c5d6fb;border-radius:26px;padding:24px 34px}.hero span{font-size:36px;color:#586379;font-weight:700}.hero b{display:block;font-size:118px;font-weight:900;letter-spacing:-.04em;line-height:1.05}.hero b small{font-size:60px;color:#586379}.hero em{font-style:normal;font-size:40px;color:#2457d6;font-weight:900}
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.sm div{border:3px solid #d5deef;border-radius:18px;padding:12px 18px;font-size:50px;font-weight:900;line-height:1.15}.sm small{display:block;font-size:30px;color:#586379;font-weight:700}
.bars div.r{display:grid;grid-template-columns:70px 1fr 60px;gap:16px;align-items:center;font-size:40px;font-weight:800;margin:8px 0}.bars i{display:block;height:26px;border-radius:8px;background:#b7c0cf}.bars i.low{background:#b42318}
.note{background:#fff3dc;border-radius:16px;padding:16px 22px;font-size:38px;font-weight:800;color:#9a5b06;margin-top:14px}
.wire{display:grid;grid-template-columns:200px 1fr;gap:20px;border:5px dashed #9aa7bf;border-radius:30px;background:#fafbfd;padding:24px;width:100%;font-size:38px;font-weight:800}
.wire .s,.wire .m>div,.wire .m>div>div{border:4px dashed #9aa7bf;border-radius:18px;background:#fff;padding:12px 16px;line-height:1.2}
.wire .s{display:flex;flex-direction:column;gap:12px}.wire .s span{border:3px dashed #b8c2d6;border-radius:12px;padding:8px 12px;font-size:34px}
.wire .m{display:flex;flex-direction:column;gap:16px}.wire .k{display:flex;gap:14px;border:0!important;background:none!important;padding:0!important}.wire .k>div{flex:1;border:4px dashed #9aa7bf;border-radius:18px;background:#fff;padding:12px 16px}.wire .k>div.big1{flex:1.8;border:5px solid #2457d6;background:#e8f0ff}
.wire .c{display:flex;gap:14px;border:0!important;background:none!important;padding:0!important}.wire .c>div{flex:1;height:150px;border:4px dashed #9aa7bf;border-radius:18px;background:#fff;padding:12px 16px}
.no{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#1b2333;color:#fff;font-size:28px;margin-right:10px;vertical-align:4px}
.chips{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chk li{list-style:none;display:flex;gap:22px;align-items:center;background:#fff;border:3px solid #d5deef;border-radius:26px;padding:24px 30px;font-size:46px;font-weight:700;margin-bottom:18px;line-height:1.25}
.chk li i{flex:none;width:58px;height:58px;border-radius:14px;border:5px solid #2457d6;display:grid;place-items:center;color:#fff;font-style:normal;font-size:44px}
.warn{background:#fdecea;border:4px solid #f3c6c2;border-radius:30px;padding:28px 36px;font-size:50px;font-weight:900;color:#b42318;text-align:center;line-height:1.3}
.con{background:#101a30;color:#ff8c8c;border-radius:30px;padding:36px;font-size:42px;line-height:1.45;font-weight:600;font-family:ui-monospace,Consolas,"WenQuanYi Zen Hei Mono",monospace}
.chat{background:#fff;border:3px solid #d5deef;border-radius:40px;padding:34px 40px;font-size:56px;font-weight:700;min-height:130px}
.x{color:#b42318;font-size:150px;font-weight:900}.ok{color:#15803d;font-size:130px;font-weight:900}
.cell{background:#fff;border:2px solid #c8d3e6;height:64px;border-radius:6px}
.ai{width:100%;border-radius:32px;overflow:hidden;position:relative;height:470px;background:linear-gradient(135deg,#7b2ff7,#f107a3 60%,#ff6a00);box-shadow:0 0 90px 16px rgba(241,7,163,.55);padding:36px;color:#fff;font-weight:900}
.ai h3{font-size:56px;line-height:1.2;margin-bottom:18px}.ai .ic{display:flex;gap:22px;font-size:84px;margin:14px 0}.ai .btn{display:inline-block;background:#fff;color:#7b2ff7;border-radius:99px;padding:14px 40px;font-size:46px}
.file{width:200px;height:260px;background:#fff;border:6px solid #1b2333;border-radius:20px;display:flex;align-items:flex-end;justify-content:center;font-size:44px;font-weight:900;padding-bottom:26px;position:relative}
.file:before{content:"";position:absolute;right:-6px;top:-6px;width:60px;height:60px;background:#e7edfa;border-left:6px solid #1b2333;border-bottom:6px solid #1b2333;border-radius:0 18px 0 18px}
.stamp{display:inline-block;transform:rotate(-6deg);border:8px solid #b42318;color:#b42318;font-size:62px;font-weight:900;padding:12px 36px;border-radius:20px;background:#fff}
</style></head><body>
<div id="stage"><div id="prog"></div><div id="tag"><b id="tn"></b><span id="tt"></span></div><div id="scenes"></div><div id="cap"></div><div id="intro"><div class="n" id="in"></div><div class="t" id="it"></div></div></div>
<script src="episodes.js"></script>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>1-Math.pow(1-p,3);
const back=p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
let EP=null,scenes=[],T0=1.0,TOTAL=46,KN=null;
function inv(tn){if(!KN)return tn;for(let i=1;i<KN.length;i++){if(tn<=KN[i][1]){const o0=KN[i-1][0],n0=KN[i-1][1],o1=KN[i][0],n1=KN[i][1];return n1===n0?o1:o0+(o1-o0)*(tn-n0)/(n1-n0)}}const L=KN[KN.length-1];return L[0]+(tn-L[1])}
function init(n,tm){
  EP=EPISODES[n]; KN=tm?tm.knots:null; TOTAL=tm?((EP.intro?0:T0)+tm.len):(EP.intro?(EP.total||3):(T0+EP.len));
  $('#tn').textContent=EP.tag||''; $('#tt').textContent=EP.tagTitle||'';
  $('#in').textContent=EP.cardNum||''; $('#it').innerHTML=EP.cardTitle||'';
  const root=$('#scenes'); root.innerHTML='';
  scenes=(EP.scenes||[]).map(sc=>{const d=document.createElement('div');d.className='scene';d.innerHTML=`<div class="hd">${sc.head||''}</div><div class="st">${sc.html}</div>`;root.appendChild(d);return {...sc,node:d,items:[...d.querySelectorAll('[data-k]')]}});
  if(EP.intro){$('#tag').style.display='none'}
}
function setT(t){
  const ts=inv(t-(EP.intro?0:T0)), introOn=!EP.intro&&t<T0;
  const ia=EP.intro?0:(introOn?(t<0.12?t/0.12:(t>T0-0.2?(T0-t)/0.2:1)):0);
  $('#intro').style.opacity=EP.intro?0:clamp(ia);
  $('#prog').style.width=(clamp(t/TOTAL)*1080)+'px';
  for(const sc of scenes){
    const tt=ts; const f=0.28;
    let o=0; if(tt>=sc.s-f&&tt<=sc.e+f){o=clamp((tt-(sc.s-f))/f)*clamp(((sc.e+f)-tt)/f)} 
    if(tt<sc.s) o=clamp((tt-(sc.s-f))/f); if(tt>sc.e) o=clamp((sc.e+f-tt)/f); if(tt>=sc.s&&tt<=sc.e) o=1;
    sc.node.style.opacity=o; sc.node.style.visibility=o>0?'visible':'hidden';
    if(o<=0) continue;
    const rel=tt-sc.s;
    for(const it of sc.items){
      const at=+it.dataset.at||0,dur=+it.dataset.dur||.5,k=it.dataset.k,until=it.dataset.until?+it.dataset.until:1e9;
      const p=clamp((rel-at)/dur); let op=p>0?1:0, tr='';
      if(rel>=until) op=0;
      if(k==='up'){op*=ease(p);tr=`translateY(${(1-ease(p))*50}px)`}
      else if(k==='fade'){op*=ease(p)}
      else if(k==='pop'){op*=clamp(p*2.2);tr=`scale(${.7+.3*back(p)})`}
      else if(k==='type'){const s=it.dataset.text||'';it.textContent=s.slice(0,Math.floor(p*s.length));op=p>0?1:0;if(rel>=until)op=0}
      else if(k==='show'){op=rel>=at?1:0;if(rel>=until)op=0}
      it.style.opacity=op; it.style.transform=tr;
    }
    if(sc.update) sc.update(rel,sc.node);
  }
  const cap=$('#cap'); const c=(EP.caps||[]).find(x=>ts>=x[0]&&ts<x[1]);
  if(c&&!EP.intro){cap.textContent=c[2];cap.style.opacity=clamp((ts-c[0])/.18)*clamp((c[1]-ts)/.18)}else cap.style.opacity=0;
}
window.initEp=init;window.setT=setT;
</script></body></html>
