<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI로 만든 대시보드, 처음부터 다시 만들지 않으려면</title>
<style>
:root{--bg:#eceff4;--paper:#fff;--ink:#1b2333;--sub:#586379;--line:#dde3ec;--soft:#f5f7fb;
  --accent:#2457d6;--accent-bg:#e8f0ff;--ok:#15803d;--ok-bg:#e7f6ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#9a5b06;--warn-bg:#fff3dc;
  --human:#d9730d;--ai:#2457d6;--code-bg:#0f1729;--code-bar:#18223a;--code-ink:#e8edff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;flex:none}
a{color:var(--accent)}
code{font:0.9em ui-monospace,"Cascadia Mono",Consolas,"D2Coding",monospace;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}

/* ───── 쪽(A4) ───── */
.sheet{position:relative;width:794px;min-height:1123px;margin:26px auto;background:var(--paper);padding:60px 56px 76px;box-shadow:0 2px 6px rgba(20,30,50,.08),0 20px 44px -22px rgba(20,30,50,.28);display:flex;flex-direction:column}
.sheet-hd{position:absolute;top:24px;left:56px;right:56px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);letter-spacing:.02em}
.sheet-ft{position:absolute;bottom:26px;left:56px;right:56px;display:flex;justify-content:space-between;gap:16px;font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:9px}
.sheet-ft span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.stepbadge{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.stepbadge b{background:var(--ink);color:#fff;border-radius:999px;padding:3px 13px;font-size:12.5px;letter-spacing:.05em}
.stepbadge span{color:var(--sub);font-size:12.5px}
h2.h{margin:0 0 6px;font-size:26px;line-height:1.32;font-weight:800;letter-spacing:-.01em}
h3{margin:14px 0 5px;font-size:15.5px;line-height:1.4}
p{margin:0 0 8px}
.lede{font-size:15.5px;color:#26314d;margin:2px 0 12px}
.sub{color:var(--sub)}

/* ───── 표지 ───── */
.cover{padding-top:64px}
.brandline{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.brandline .brand{font-weight:800;color:var(--accent);letter-spacing:.04em}
.brandline .cat{font-size:12.5px;background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:2px 12px;font-weight:700}
.cover h1{margin:0;font-size:38px;line-height:1.34;font-weight:900;letter-spacing:-.02em}
.cover .sub{font-size:17px;margin:14px 0 10px;color:#344060}
.cover .meta{font-size:13px;color:var(--sub);margin:0 0 18px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.toc h3{margin:0 0 10px;font-size:15px;letter-spacing:.04em}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc li a{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;align-items:baseline;color:inherit;text-decoration:none;padding:5px 8px;border-radius:8px}
.toc li a:hover{background:var(--soft)}
.toc li a em{font-style:normal;font-weight:800;color:var(--accent);font-size:13px}
.toc li a i{font-style:normal;color:var(--sub);font-size:12.5px;text-align:right}
.toc li.more a em{color:var(--sub)}
.coverfoot{margin-top:auto;font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}

/* ───── ❌ / ✅ 비교 ───── */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 8px}
.vs>div{border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.6}
.vs .bad{background:var(--bad-bg);border:1px solid #f3c6c2}
.vs .good{background:var(--ok-bg);border:1px solid #bde3cb}
.vs h4{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px}
.vs .bad h4{color:var(--bad)} .vs .good h4{color:var(--ok)}
.vs p{margin:0}.vs .why{display:block;margin-top:5px;font-size:12.5px;color:var(--sub)}

/* ───── 붙여넣기 상자 ───── */
.tb{border-radius:12px;background:var(--code-bg);color:var(--code-ink);overflow:hidden;margin:8px 0 8px;box-shadow:0 10px 24px -16px rgba(15,23,41,.6)}
.tb-bar{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;background:var(--code-bar);border-bottom:1px solid #27324f}
.tb-dots{display:flex;gap:5px}.tb-dots i{width:9px;height:9px;border-radius:50%;background:#3d4a6d;display:block}
.tb-title{font-size:12px;font-weight:700;color:#b5c2e8;line-height:1.4;min-width:0}
.tb-title .ic{margin-right:6px}
.tb-title .where{color:#fff}
.copy{margin-left:auto;font:700 12px/1 inherit;font-family:inherit;border-radius:999px;border:1px solid #3d4b75;background:#222e4d;color:#dfe7ff;padding:6px 13px;cursor:pointer}
.copy:hover{background:#2d3b61}
.tb pre{margin:0;padding:12px 16px 14px;font:13px/1.65 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.tb.cmd pre{font:12.6px/1.6 ui-monospace,"Cascadia Mono",Consolas,"D2Coding",monospace}
.ph{background:rgba(250,190,70,.2);color:#ffd98b;border-radius:4px;padding:0 3px}
.tb .lab{color:#8fb4ff;font-weight:700}

/* ───── 설명 줄 ───── */
.okl{display:flex;gap:10px;background:var(--ok-bg);border-left:4px solid var(--ok);border-radius:0 9px 9px 0;padding:8px 13px;margin:8px 0;font-size:13.5px}
.okl b{color:var(--ok);white-space:nowrap}
.def{font-size:13px;color:var(--sub);margin:5px 0;padding-left:2px}
.def b{color:var(--ink)}
.callout{border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13.5px;line-height:1.65;border:1px solid var(--line);background:var(--soft)}
.callout b.t{display:block;margin-bottom:2px}
.callout.warn{background:var(--warn-bg);border-color:#f2d9a6}.callout.warn b.t{color:var(--warn)}
.callout.bad{background:var(--bad-bg);border-color:#f3c6c2}.callout.bad b.t{color:var(--bad)}
.callout.ok{background:var(--ok-bg);border-color:#bde3cb}.callout.ok b.t{color:var(--ok)}
.callout.info{background:var(--accent-bg);border-color:#c5d6fb}.callout.info b.t{color:var(--accent)}
ul.tight,ol.tight{margin:4px 0 8px;padding-left:1.25em}ul.tight li,ol.tight li{margin:2px 0}

/* ───── 표 · 목록 · 그림 ───── */
table.tbl{width:100%;border-collapse:collapse;font-size:13px;line-height:1.55;margin:6px 0 10px}
table.tbl th{background:var(--soft);text-align:left;font-weight:700;padding:7px 10px;border:1px solid var(--line)}
table.tbl td{padding:7px 10px;border:1px solid var(--line);vertical-align:top}
table.tbl td:first-child{font-weight:700;white-space:nowrap}
table.tbl.top td:first-child{white-space:normal}
.fig{margin:0}.fig img{display:block;width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.fig figcaption{font-size:12px;color:var(--sub);margin-top:5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.row-fig{display:grid;grid-template-columns:372px minmax(0,1fr);gap:16px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff}
.card h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:7px}
.card.human{border-top:4px solid var(--human)}.card.ai{border-top:4px solid var(--ai)}
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin:12px 0 4px}
.flow div{border:1px solid var(--line);border-radius:10px;padding:7px 3px 6px;text-align:center;font-size:12px;line-height:1.35;background:#fff;position:relative}
.flow div b{display:block;font-size:11px;color:var(--sub);font-weight:700}
.flow div i{display:block;width:9px;height:9px;border-radius:50%;margin:5px auto 0}
.flow .h i{background:var(--human)}.flow .a i{background:var(--ai)}.flow .m i{background:linear-gradient(90deg,var(--human) 50%,var(--ai) 50%)}
.legend{font-size:12px;color:var(--sub);display:flex;gap:14px;justify-content:center;margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
dl.prof{margin:6px 0 4px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.3px}
dl.prof dt{background:var(--soft);font-weight:700;padding:7px 12px;border-bottom:1px solid var(--line)}
dl.prof dd{margin:0;padding:7px 12px;border-bottom:1px solid var(--line);line-height:1.55}
dl.prof dt:last-of-type,dl.prof dd:last-of-type{border-bottom:0}
ul.check{list-style:none;margin:6px 0;padding:0;display:grid;gap:7px;font-size:13.8px}
ul.check li{position:relative;padding-left:30px}
ul.check li::before{content:"";position:absolute;left:0;top:3px;width:17px;height:17px;border:2px solid var(--accent);border-radius:5px}
.crit{counter-reset:c;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px;margin:4px 0 6px}
.crit span{position:relative;padding-left:24px}
.crit span::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 8px}
.g3 div{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;line-height:1.5}
.g3 b{display:block;font-size:13px;margin-bottom:1px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:4px;vertical-align:1px}
.tag.h{background:#fdebd7;color:#9a4b05}.tag.a{background:var(--accent-bg);color:var(--accent)}
.ok-cell{color:var(--ok);font-weight:800}

/* ───── 비교용 미니 화면 (가상 숫자) ───── */
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 11px 11px;background:#fff;height:318px;overflow:hidden;position:relative}
.mini .mt{font-size:12px;font-weight:800;margin-bottom:7px}
.mcap{font-size:12.5px;font-weight:800;margin:0 0 5px;display:flex;align-items:center;gap:6px}
.mcap.b{color:var(--bad)}.mcap.g{color:var(--ok)}
.mbad .mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.mbad .mgrid div{height:50px;border-radius:6px;color:#fff;font-weight:900;font-size:17px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.1}
.mbad .mgrid div small{font-size:9.5px;font-weight:700;opacity:.9}
.mbad .mrow{display:flex;gap:10px;align-items:center;margin-top:9px}
.mbad .mpie{width:92px;height:92px;border-radius:50%;flex:none;background:conic-gradient(#e8453c 0 24%,#2fa84f 0 43%,#8e44ad 0 60%,#f39c12 0 77%,#16a0c4 0 90%,#d35400 0)}
.mbad .mleg{font-size:9.5px;line-height:1.5;color:#555;display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.mbad .mleg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
.mgood .mhero{background:var(--accent-bg);border:1px solid #c5d6fb;border-radius:8px;padding:6px 10px}
.mgood .mhero span{font-size:10px;color:var(--sub)}
.mgood .mhero b{display:block;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.mgood .mhero b small{font-size:13px;color:var(--sub);font-weight:700;margin-left:2px}
.mgood .mhero em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--accent)}
.mgood .mhero em u{text-decoration:none;color:var(--sub);font-weight:500}
.mgood .msmall{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}
.mgood .msmall div{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-weight:800;font-size:13px;line-height:1.2}
.mgood .msmall small{display:block;font-size:9px;color:var(--sub);font-weight:500}
.mgood .mbars{position:relative;display:grid;gap:3px;font-size:9.5px;margin-top:2px}
.mgood .mbars div{display:grid;grid-template-columns:36px 1fr 28px;gap:5px;align-items:center}
.mgood .mbars i{display:block;height:8px;border-radius:2px;background:#b7c0cf}
.mgood .mbars i.low{background:var(--bad)}
.mgood .mbars b{text-align:right;font-weight:800}
.mgood .mline{position:absolute;top:-2px;bottom:-2px;left:calc(36px + 5px + (100% - 36px - 28px - 10px) * .8);border-left:1.5px dashed #556;}
.mgood .mnote{margin-top:9px;font-size:10.5px;background:var(--warn-bg);border-radius:6px;padding:4px 8px;color:var(--warn);font-weight:700}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.chips span{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:7px;font-weight:900;font-size:13px;color:#fff}
.chips .gA{background:#1c5cab}.chips .gB{background:#5598e7}.chips .gC{background:#ef8f8c;color:#3a0d0d}.chips .gD{background:#c93434}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.88);display:none;place-items:center;cursor:zoom-out;padding:24px}
#lb.open{display:grid}#lb img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}

/* ───── 지도 · 스케치 · 응용 ───── */
.ipo{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);align-items:stretch;margin:8px 0 6px}
.ipo>div:not(.ar){border:1px solid var(--line);border-top:4px solid var(--human);border-radius:12px;padding:9px 12px 10px;background:#fff;font-size:12.8px;line-height:1.55}
.ipo>.pr{border-top-color:var(--ai);background:var(--accent-bg)}
.ipo .ar{display:grid;place-items:center;color:var(--sub);font-weight:800}
.ipo em,.stages em{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.04em;margin-bottom:2px;color:var(--human)}
.ipo>.pr em,.stages em{color:var(--ai)}
.ipo b,.stages b,.five b{display:block;font-size:14px;line-height:1.4;margin-bottom:3px}
.ipo i,.stages i,.five i{display:block;font-style:normal;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--accent)}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.stages>div{border:1px solid #c5d6fb;border-radius:12px;padding:9px 12px 10px;font-size:12.8px;line-height:1.55}
.stages>div:nth-child(1){background:#f4f8ff}.stages>div:nth-child(2){background:#e8f0ff}.stages>div:nth-child(3){background:#d9e6ff}.stages>div:nth-child(4){background:#cadcff}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:6px 0 8px}
.five>div{border:1px solid var(--line);border-radius:10px;padding:8px 9px 9px;font-size:12.3px;line-height:1.5;background:#fff}
.five b{font-size:13px}
.wire{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;border:1.5px dashed #9aa7bf;border-radius:12px;background:#fafbfd;padding:10px;font-size:12px;line-height:1.4}
.wire .ws{display:flex;flex-direction:column;gap:6px;border:1.5px dashed #9aa7bf;border-radius:8px;background:#fff;padding:8px}
.wire .ws span{border:1px dashed #b8c2d6;border-radius:6px;padding:4px 7px}
.wire .ws .wl{border:0;padding:0 0 2px;font-weight:700;color:var(--sub)}
.wire .wm{display:grid;gap:8px;min-width:0}
.wire .wh{display:flex;justify-content:space-between;gap:8px}
.wire .wh span,.wire .wk>div,.wire .wc>div,.wire .wn,.wire .wt{border:1.5px dashed #9aa7bf;border-radius:8px;background:#fff;padding:6px 8px}
.wire .wk{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:8px}
.wire .wk .big{border:1.5px solid var(--accent);background:var(--accent-bg);font-weight:800}
.wire .wc{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}.wire .wc>div{height:46px}
.wire .wt{height:32px}
.wire .no{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;margin-right:5px;vertical-align:1px}
table.tbl.dense td,table.tbl.dense th{padding:5px 10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.row3 .callout{margin:6px 0;font-size:12.8px;line-height:1.6}

@media screen and (max-width:860px){
  .sheet{width:auto;min-height:0;margin:12px;padding:56px 20px 70px}
  .sheet-hd,.sheet-ft{left:20px;right:20px}
  .cover h1{font-size:28px}.vs,.row2,.row3,.row-fig{grid-template-columns:1fr}
  code{white-space:normal;word-break:break-all}table.tbl{font-size:12px}table.tbl td:first-child{white-space:normal}.g3{grid-template-columns:1fr}.crit{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}.toc li a{grid-template-columns:70px minmax(0,1fr) 40px}
  .ipo{grid-template-columns:1fr}.ipo .ar{height:22px;transform:rotate(90deg)}.stages,.five{grid-template-columns:1fr 1fr}
  .wire{grid-template-columns:1fr}.wire .wk{grid-template-columns:1fr 1fr}.wire .wc{grid-template-columns:1fr}
}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .sheet{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:0;overflow:hidden;break-after:page;page-break-after:always}
  .copy,#lb{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M8.2 8.2l7.6 7.6M15.8 8.2l-7.6 7.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.6l3.3 3.2L17 9.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2L4.5 13.5h6L9.5 22l9-11.5h-6z" fill="currentColor"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5h16v11H9.5L4 20.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M7.2 10l3 2.2-3 2.2M12.5 15h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="currentColor"/><path d="M12 9.5v5M12 17.6v.1" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>
