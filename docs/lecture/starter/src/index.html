<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협력사 종합평가 (실습)</title>
<style>
:root{--page:#f3f5f9;--surface:#fff;--surface-2:#f6f8fb;--ink:#0f172a;--ink-2:#475569;--muted:#64748b;--grid:#e6eaf0;--border:rgba(15,23,42,.1);
  --accent:#2a78d6;--accent-ink:#1c5cab;--good:#1c5cab;--bad:#c62828;--warn-bg:rgba(250,178,25,.22);--warn:#8a5a00;--side:#0f1d3d;
  --gA:#1c5cab;--gB:#5598e7;--gC:#ef8f8c;--gD:#c93434}
body.dark{--page:#0d1016;--surface:#161a22;--surface-2:#1c212b;--ink:#eef1f6;--ink-2:#c3cad6;--muted:#8d97a8;--grid:#262c38;--border:rgba(255,255,255,.1);
  --accent:#3987e5;--accent-ink:#86b6ef;--good:#86b6ef;--bad:#f07373;--warn-bg:rgba(250,178,25,.2);--warn:#f5b83d;--gA:#9ec5f4;--gB:#2a78d6;--gC:#a64444;--gD:#f07373}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
header{background:var(--side);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{color:#aab6d1;font-size:12.5px;flex:1}
button,select,input{font:inherit;color:inherit}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.btn:hover{background:var(--surface-2)}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
main{max-width:1280px;margin:0 auto;padding:18px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 10px}
.filters .spacer{flex:1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.grid>.c3{grid-column:span 3}.grid>.c4{grid-column:span 4}.grid>.c6{grid-column:span 6}
.card h3{margin:0 0 2px;font-size:14.5px}.card .sub{margin:0 0 12px;color:var(--muted);font-size:12px}
.kpi .label{color:var(--ink-2);font-size:13px}.kpi .val{font-size:30px;font-weight:800;margin:4px 0 2px}.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi.key{background:#eef5ff;border-color:#b7d3f6}body.dark .kpi.key{background:#13233d;border-color:#1c5cab}
.delta{font-size:12.5px;font-weight:700}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.badge{display:inline-block;height:22px;line-height:22px;padding:0 8px;border-radius:11px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700;margin-left:6px;vertical-align:middle}
.seg{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 12px}
.seg i{display:grid;place-items:center;font:700 12px/1 system-ui;font-style:normal;color:#fff;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.track{position:relative;height:16px;background:var(--grid);border-radius:4px}.fill{height:100%;border-radius:4px 4px 4px 4px;background:var(--ctx,#b4bcc8)}
.fill.bad{background:var(--bad)}.line70{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-size:12px}
td{padding:8px;border-bottom:1px solid var(--grid)}td.r,th.r{text-align:right}tr:hover td{background:var(--surface-2)}
.chip{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:6px;font-weight:800;font-size:12px;color:#fff}
.chip.A{background:var(--gA)}.chip.B{background:var(--gB)}.chip.C{background:var(--gC);color:#3b0d0d}.chip.D{background:var(--gD)}
body.dark .chip.A,body.dark .chip.C{color:#0d1016}
.mini{display:flex;align-items:center;gap:8px;justify-content:flex-end}.mini .track{width:80px;height:8px}
.name b{display:block}.name span{color:var(--muted);font-size:12px}
.err{max-width:640px;margin:80px auto;padding:28px;border:2px dashed var(--bad);border-radius:12px;background:var(--surface)}.err h2{margin:0 0 8px;color:var(--bad)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 0 24px}
@media (max-width:900px){.grid>.c3{grid-column:span 6}.grid>.c4,.grid>.c6{grid-column:span 12}}
</style>
</head>
<body>
<header><h1 id="title">협력사 종합평가</h1><div class="sub" id="sub"></div><button class="btn" id="theme" title="다크 모드 (T)">다크 모드</button></header>
<main id="app"></main>
<footer id="foot"></footer>
<script src="settings.js"></script>
<script src="data.js?v=__BUILD__"></script>
<script>
(function () {
  'use strict';
  const D = window.__DATA__, S = window.SUPPLIER_SETTINGS, $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const f1 = v => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1);
  const avg = (a, f) => { const v = a.map(f).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };

  // ── 데이터가 없으면 샘플로 대신 보여 주지 않고, 원인을 알려 주는 오류 화면 ──
  if (!D || !S) {
    $('#app').innerHTML = '<div class="err"><h2>데이터를 불러오지 못했습니다</h2><p><code>data.js</code>가 없거나 읽을 수 없습니다. <code>python build.py</code>를 실행했는지, <code>data.js</code>가 <code>index.html</code>과 같은 폴더에 있는지 확인하세요.</p></div>';
    return;
  }
  const state = { group: '', q: '', sort: 'desc', limit: 20 };
  const filtered = () => D.suppliers.filter(x => (!state.group || x.group === state.group) && (!state.q || (x.name + x.code).toLowerCase().includes(state.q.toLowerCase())));
  const GR = ['A', 'B', 'C', 'D'], GCOL = { A: 'var(--gA)', B: 'var(--gB)', C: 'var(--gC)', D: 'var(--gD)' };
  const delta = (d, unit) => d == null ? '<span class="delta flat">–</span>' : Math.abs(d) < 0.05 ? `<span class="delta flat">– 0.0${unit}</span>` : d > 0 ? `<span class="delta up">▲ ${f1(d)}${unit}</span>` : `<span class="delta down">▼ ${f1(-d)}${unit}</span>`;

  function kpis(L) {
    const n = L.length, a = avg(L, x => x.score), p = avg(L.filter(x => x.prev != null), x => x.prev), cnt = g => L.filter(x => x.grade === g).length;
    const aR = n ? cnt('A') / n * 100 : 0, cdR = n ? (cnt('C') + cnt('D')) / n * 100 : 0;
    return `<div class="grid">
      <div class="card kpi key c3"><div class="label">평균 종합 점수</div><div class="val">${f1(a)}<small>점</small></div>${delta(a != null && p != null ? a - p : null, '점')} <span class="sub">전년 대비 · 목표 ${S.target}점</span></div>
      <div class="card kpi c3"><div class="label">평가 협력사</div><div class="val">${n.toLocaleString()}<small>개사</small></div><span class="sub">${state.group || '전체'} 기준</span></div>
      <div class="card kpi c3"><div class="label">A등급 (${S.gradeCut.A}점 이상)</div><div class="val">${Math.round(aR)}<small>%</small></div><span class="sub">${cnt('A')}개사</span></div>
      <div class="card kpi c3"><div class="label">C·D 등급 (${S.gradeCut.B}점 미만)</div><div class="val">${Math.round(cdR)}<small>%</small></div><span class="sub">${cnt('C') + cnt('D')}개사</span></div></div>`;
  }
  function gradeCard(L) {
    const n = L.length || 1, c = g => L.filter(x => x.grade === g).length;
    return `<div class="card c4"><h3>등급 분포</h3><p class="sub">A≥${S.gradeCut.A} · B≥${S.gradeCut.B} · C≥${S.gradeCut.C} · D 미만</p>
      <div class="seg">${GR.map(g => c(g) ? `<i style="flex:${c(g)};background:${GCOL[g]}">${g} ${Math.round(c(g) / n * 100)}%</i>` : '').join('')}</div>
      <div class="legend">${GR.map(g => `<span><span class="dot" style="background:${GCOL[g]}"></span>${g} ${c(g)}개사</span>`).join('')}</div></div>`;
  }
  function areaCard(L) {
    return `<div class="card c4"><h3>영역별 평균 점수</h3><p class="sub">점선 = ${S.lowLine}점 (이보다 낮으면 빨강)</p><div class="bars">${S.areas.map(a => {
      const v = avg(L, x => x.areas[a]);
      return `<div class="bar"><span>${esc(a)}</span><div class="track"><div class="fill ${v != null && v < S.lowLine ? 'bad' : ''}" style="width:${v || 0}%"></div><div class="line70" style="left:${S.lowLine}%"></div></div><span class="num">${f1(v)}</span></div>`; }).join('')}</div></div>`;
  }
  function trendCard(L) {
    const ys = D.meta.years, v = ys.map(y => avg(L, x => x.hist[String(y)])), have = v.filter(x => x != null);
    const W = 420, H = 200, m = { l: 34, r: 24, t: 20, b: 26 };
    const lo = Math.floor(Math.min(...have, S.target) - 2), hi = Math.ceil(Math.max(...have, S.target) + 2);
    const X = i => m.l + i * (W - m.l - m.r) / (ys.length - 1), Y = val => m.t + (hi - val) * (H - m.t - m.b) / (hi - lo);
    let path = '', pen = false;
    v.forEach((val, i) => { if (val == null) { pen = false; return; } path += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(val).toFixed(1)}`; pen = true; });
    const badge = have.length < ys.length ? `<span class="badge">자료 ${have.length}/${ys.length}개년</span>` : '';
    return `<div class="card c4"><h3>${ys.length}개년 추이${badge}</h3><p class="sub">기준연도 평가 협력사의 평균 점수 · 점선 = 목표</p>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="연도별 평균 점수 추이">
        <line x1="${m.l}" x2="${W - m.r}" y1="${Y(S.target)}" y2="${Y(S.target)}" stroke="currentColor" stroke-dasharray="5 4" opacity=".6"/>
        <text x="${W - m.r}" y="${Y(S.target) - 5}" text-anchor="end" font-size="11" fill="currentColor">목표 ${S.target}</text>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
        ${v.map((val, i) => val == null ? '' : `<circle cx="${X(i)}" cy="${Y(val)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${ys[i]}년 ${f1(val)}점</title></circle><text x="${X(i)}" y="${Y(val) - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${f1(val)}</text>`).join('')}
        ${ys.map((y, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="11.5" fill="${v[i] == null ? 'var(--muted)' : 'currentColor'}">${y}</text>`).join('')}
      </svg></div>`;
  }
  function tableCard(L) {
    const sorters = { desc: (a, b) => b.score - a.score, asc: (a, b) => a.score - b.score, up: (a, b) => (b.score - (b.prev ?? b.score)) - (a.score - (a.prev ?? a.score)), down: (a, b) => (a.score - (a.prev ?? a.score)) - (b.score - (b.prev ?? b.score)) };
    const rows = L.slice().sort(sorters[state.sort]);
    return `<div class="card"><h3>협력사 목록 <span class="sub">${L.length.toLocaleString()}개사</span></h3>
      <div class="filters" style="margin:8px 0 10px"><select id="sort" aria-label="정렬"><option value="desc">점수 높은 순</option><option value="asc">점수 낮은 순</option><option value="up">전년 대비 상승 큰 순</option><option value="down">전년 대비 하락 큰 순</option></select><span class="spacer"></span><button class="btn" id="csv">CSV 내려받기</button></div>
      <table><thead><tr><th>#</th><th>협력사</th><th class="r">종합 점수</th><th>등급</th><th class="r">전년 대비</th></tr></thead><tbody>${rows.slice(0, state.limit).map((x, i) => `<tr>
        <td>${i + 1}</td><td class="name"><b>${esc(x.name)}</b><span>${esc(x.code)} · ${esc(x.group)}</span></td>
        <td class="r"><div class="mini"><div class="track"><div class="fill ${x.score < S.lowLine ? 'bad' : ''}" style="width:${x.score}%"></div></div><span class="num">${f1(x.score)}</span></div></td>
        <td><span class="chip ${x.grade}">${x.grade}</span></td><td class="r">${delta(x.prev != null ? x.score - x.prev : null, '점')}</td></tr>`).join('')}</tbody></table>
      ${rows.length > state.limit ? `<p style="text-align:center;margin:12px 0 0"><button class="btn" id="more">더 보기 (${rows.length - state.limit}개사 남음)</button></p>` : ''}</div>`;
  }
  function render() {
    const L = filtered(), groups = [...new Set(D.suppliers.map(x => x.group))].sort();
    $('#app').innerHTML = `<div class="filters"><select id="group" aria-label="업종"><option value="">업종: 전체</option>${groups.map(g => `<option ${g === state.group ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
      <input id="q" type="search" placeholder="협력사 이름·코드 검색" value="${esc(state.q)}"><span class="spacer"></span></div>
      ${kpis(L)}<div class="grid">${gradeCard(L)}${areaCard(L)}${trendCard(L)}</div>${tableCard(L)}`;
    $('#sort').value = state.sort;
    $('#group').onchange = e => { state.group = e.target.value; state.limit = 20; render(); };
    $('#q').oninput = e => { state.q = e.target.value; state.limit = 20; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };
    $('#sort').onchange = e => { state.sort = e.target.value; render(); };
    if ($('#more')) $('#more').onclick = () => { state.limit += 20; render(); };
    $('#csv').onclick = () => {
      const head = ['협력사 코드', '협력사명', '업종', '종합 점수', '등급', '전년 종합 점수'], q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const body = L.map(x => [x.code, x.name, x.group, x.score, x.grade, x.prev].map(q).join(',')).join('\r\n');
      const a = document.createElement('a'); a.download = '협력사목록.csv';
      a.href = URL.createObjectURL(new Blob(['\uFEFF' + head.map(q).join(',') + '\r\n' + body], { type: 'text/csv;charset=utf-8' }));   // BOM: 엑셀에서 한글이 깨지지 않게
      document.body.append(a); a.click(); a.remove();
    };
  }
  $('#title').textContent = S.title;
  $('#sub').textContent = `기준연도 ${D.meta.baseYear} · 최종 갱신 ${D.meta.generatedAt} · 데이터: ${D.meta.source}`;
  $('#foot').textContent = '이 화면은 가상 샘플 데이터로 만든 실습용입니다.';
  const setTheme = on => { document.body.classList.toggle('dark', on); try { localStorage.setItem('starter-theme', on ? 'dark' : 'light'); } catch (e) { /* 저장 불가 환경은 무시 */ } };
  try { if (localStorage.getItem('starter-theme') === 'dark') setTheme(true); } catch (e) { /* 무시 */ }
  $('#theme').onclick = () => setTheme(!document.body.classList.contains('dark'));
  document.addEventListener('keydown', e => { if ((e.key === 't' || e.key === 'T') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) setTheme(!document.body.classList.contains('dark')); });
  render();
})();
</script>
</body>
</html>
