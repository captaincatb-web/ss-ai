<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협력사 종합평가</title>
<!--
  협력사 종합평가 대시보드 — 화면 목업 v2
  · 모든 수치는 브라우저에서 생성한 가상 샘플 데이터입니다. (실데이터 없음)
  · 외부 라이브러리/CDN 없이 단일 HTML — 사내망에서 그대로 열림
  · 설계 원칙: 핵심 지표 우선 · 색은 의미 있을 때만(파랑=좋음, 빨강=나쁨, 회색=보통/맥락)
              · 기준선(목표·평균·전년) 표시 · 차트마다 "그래서?" 인사이트 · 검색/칩 필터 · 분명한 다음 행동
  · 엑셀 4종 ↔ 화면 필드 매핑은 스크립트의 COLUMNS, 기준값은 CONFIG 참고 (docs/종합평가_대시보드_명세.md)
-->
<style>
:root{
  --page:#f3f5f9; --surface:#fff; --surface-2:#f6f8fb; --ink:#0f172a; --ink-2:#475569; --muted:#64748b;
  --grid:#e6eaf0; --axis:#c5cdd8; --border:rgba(15,23,42,.09); --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
  --accent:#2a78d6; --accent-ink:#1c5cab; --key-bg:#eef5ff; --key-border:#b7d3f6;
  --ctx:#b4bcc8; --bench:#475569; --track:#dce9fb; --track-bad:#fbe1e0;
  --good-text:#1c5cab; --bad-text:#c62828; --warn-text:#8a5a00;
  --chip-blue:rgba(42,120,214,.12); --chip-bad:rgba(208,59,59,.12); --chip-warn:rgba(250,178,25,.22); --chip-gray:rgba(15,23,42,.06);
  --side:#0f1d3d; --side-ink:#c9d3e6; --side-muted:#8796b5; --side-active:#f5a524; --side-active-ink:#1a1300;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0d1016; --surface:#161a22; --surface-2:#1c212b; --ink:#eef1f6; --ink-2:#c3cad6; --muted:#8d97a8;
  --grid:#262c38; --axis:#3a4252; --border:rgba(255,255,255,.08); --shadow:none;
  --accent:#3987e5; --accent-ink:#86b6ef; --key-bg:#13233d; --key-border:#1c5cab;
  --ctx:#4a5361; --bench:#c3cad6; --track:#13325c; --track-bad:#4a2326;
  --good-text:#86b6ef; --bad-text:#f07373; --warn-text:#f5b83d;
  --chip-blue:rgba(57,135,229,.18); --chip-bad:rgba(208,59,59,.24); --chip-warn:rgba(250,178,25,.20); --chip-gray:rgba(255,255,255,.07);
  --side:#0a1122; --side-ink:#c9d3e6; --side-muted:#7f8db0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.tn{font-variant-numeric:tabular-nums}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 224px,transparent 224px)}
.sidebar{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--side-active);display:grid;place-items:center;color:var(--side-active);flex:none}
.brand-t{font-weight:700;font-size:15px;line-height:1.2;color:#fff}
.brand-s{font-size:11px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap}
.nav a small{display:block;font-weight:500;font-size:11px;color:var(--side-muted)}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:var(--side-active);color:var(--side-active-ink)}
.nav a[aria-current="page"] small{color:rgba(26,19,0,.7)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08);padding-top:14px;display:grid;gap:4px}
.main{min-width:0;padding:20px 24px 48px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.02em}
.topbar h1{margin:2px 0 0;font-size:23px;letter-spacing:-.01em}
.topbar .lead{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn[aria-pressed="true"]{background:var(--chip-blue);border-color:transparent;color:var(--accent-ink)}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.link:hover{text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.f{display:flex;flex-direction:column;gap:3px;min-width:120px;flex:1}
.f label{font-size:11px;color:var(--muted);font-weight:600}
.f select,.f input{height:34px;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:0 10px;min-width:0}
.active-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:-4px}
.active-f:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:999px;background:var(--chip-blue);color:var(--accent-ink);font-weight:600;border:0;cursor:pointer}
.fchip b{font-weight:800}
.empty{background:var(--surface);border:1px dashed var(--axis);border-radius:12px;padding:28px;text-align:center;color:var(--ink-2)}

/* ── 섹션 / 카드 ── */
.page{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:10px 2px -4px}
.sec-h h2{margin:0;font-size:16px;letter-spacing:-.01em}
.sec-h p{margin:0;font-size:12.5px;color:var(--muted)}
.sec-h .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:800;align-self:center}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-h h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-h .sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;flex:none;align-items:center}
.info{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:800;cursor:help;display:inline-grid;place-items:center;padding:0;flex:none}
.tbl-view{display:none}
.card.show-table .chart-view{display:none}
.card.show-table .tbl-view{display:block}
.chart-view{display:flex;flex-direction:column;gap:10px;min-width:0}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--grid)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend:empty{display:none}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg-rect{width:10px;height:10px;border-radius:2px}
.lg-line{width:16px;height:2px;border-radius:1px}
.lg-dash{width:16px;height:0;border-top:2px dashed var(--bench)}
.lg-tick{width:2px;height:12px;background:var(--bench);border-radius:1px}
.muted{color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin:0}

/* ── 인사이트 ("그래서?") ── */
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ins{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.ins .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.ins .ic svg{width:16px;height:16px}
.ins p{margin:0;font-size:13px;color:var(--ink-2)}
.ins p b{color:var(--ink)}
.ins .link{margin-top:4px}
.callout{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:9px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2)}
.callout svg{width:15px;height:15px;flex:none;margin-top:2px}
.callout b{color:var(--ink)}
.callout.bad{background:var(--chip-bad)} .callout.bad svg{color:var(--bad-text)}
.callout.good{background:var(--chip-blue)} .callout.good svg{color:var(--good-text)}
.callout.warn{background:var(--chip-warn)} .callout.warn svg{color:var(--warn-text)}
.callout .link{margin-left:auto;align-self:center}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:1.35fr repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi.key{background:var(--key-bg);border-color:var(--key-border)}
.kpi-top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.kpi-label{font-size:12.5px;color:var(--ink-2);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi-label svg{width:15px;height:15px}
.kpi-val{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.kpi.key .kpi-val{font-size:34px}
.kpi-val small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi-row{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .meter{margin-top:4px}
.kpi .link{margin-top:auto;padding-top:4px}
.atiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.atile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);min-width:0}
.atile:hover{border-color:var(--axis)}
.atile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--key-bg)}
.atile .nm{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:4px}
.atile .nm span{font-weight:600;color:var(--muted);font-size:11px}
.atile .v{font-size:22px;font-weight:750;line-height:1.1;letter-spacing:-.01em}
.atile .st{font-size:11.5px;font-weight:700}
.atile .meter{flex:none;width:100%}

/* ── 차트 부품 ── */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.hb{display:flex;flex-direction:column}
.hb-row{display:grid;grid-template-columns:var(--lw,96px) minmax(0,1fr) var(--vw,52px) var(--ew,0px);column-gap:10px;align-items:center;padding:0 4px;border-radius:6px}
.hb-row:not(.hb-head):hover,.hb-row:focus-visible{background:var(--surface-2)}
.hb-row.click{cursor:pointer}
.hb-head{font-size:11px;color:var(--muted)}
.hb-label{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-row.hl .hb-label{color:var(--ink);font-weight:700}
.hb-plot{position:relative;height:30px;display:flex;align-items:center}
.hb-head .hb-plot{height:18px}
.hb-bar{height:16px;border-radius:0 4px 4px 0;display:block}
.hb-bench{position:absolute;top:0;bottom:0;border-left:2px dashed var(--bench);opacity:.7}
.hb-bench-l{position:absolute;bottom:2px;transform:translateX(-50%);font-size:11px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.hb-tick{position:absolute;top:6px;bottom:6px;width:3px;background:var(--bench);border-radius:2px;transform:translateX(-1.5px)}
.hb-val{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
.hb-extra{font-size:12px;white-space:nowrap;text-align:right}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:800;margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--chip-bad);color:var(--bad-text)} .tag.good{background:var(--chip-blue);color:var(--good-text)} .tag.gray{background:var(--chip-gray);color:var(--ink-2)}
.segrows{display:flex;flex-direction:column;gap:10px}
.segrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.segrow .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.segbar{display:flex;gap:2px;height:30px}
.segbar>span{display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.segbar>span:first-child{border-radius:4px 0 0 4px}.segbar>span:last-child{border-radius:0 4px 4px 0}
.segbar>span.nolabel{color:transparent!important}
.bigtrio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bigtrio>div{border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.bigtrio .k{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.bigtrio .k svg{width:14px;height:14px}
.bigtrio .v{font-size:22px;font-weight:750;letter-spacing:-.01em}
.bigtrio .v small{font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.bigtrio .up .k{color:var(--good-text)} .bigtrio .down .k{color:var(--bad-text)}
.tmx{display:grid;grid-template-columns:auto repeat(5,minmax(30px,1fr));gap:2px;font-size:12px}
.tmx .h{color:var(--muted);font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;min-height:22px}
.tmx .rh{justify-content:flex-start;padding-right:6px;white-space:nowrap}
.tmx .c{border-radius:4px;display:grid;place-items:center;min-height:30px;font-weight:700}
.hm{display:grid;gap:2px;font-size:12px}
.hm .h{color:var(--muted);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;min-height:22px;text-align:center;line-height:1.2}
.hm .rh{justify-content:flex-start;padding-right:6px;white-space:nowrap}
.hm .c{border-radius:4px;display:grid;place-items:center;min-height:34px;font-weight:700}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.scale span.sw{width:18px;height:10px;border-radius:2px;display:inline-block}
.dstack{display:grid;grid-template-columns:var(--lw,72px) minmax(0,1fr) 64px;gap:6px 10px;align-items:center}
.dstack .lbl{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dstack .lbl.sel{color:var(--ink);font-weight:800}
.dstack .bar{display:flex;gap:2px;height:22px;cursor:pointer}
.dstack .bar>span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;min-width:0;padding:0 4px;white-space:nowrap}
.dstack .bar>span:first-child{border-radius:4px 0 0 4px}.dstack .bar>span:last-child{border-radius:0 4px 4px 0}
.dstack .bar>span.nolabel{color:transparent!important}
.dstack .rv{font-size:12px;text-align:right;white-space:nowrap}
.meter{position:relative;display:block;height:8px;border-radius:4px;background:var(--track);min-width:48px;width:100%;flex:none}
.mcell .meter{flex:1;width:auto}
.link svg{width:14px;height:14px}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.gstats>div{border-radius:10px;background:var(--surface-2);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.gstats .g{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.gstats .v{font-size:17px;font-weight:750}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.meter.bad{background:var(--track-bad)} .meter.bad>i{background:#d03b3b}
.meter.ctx>i{background:var(--ctx)}
.meter>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bench);border-radius:1px;transform:translateX(-1px)}
.mcell{display:flex;align-items:center;gap:8px;min-width:120px}
.mcell .v{min-width:38px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;align-items:center;min-width:110px}
.seg>span{height:20px;display:flex;align-items:center;min-width:0}
.seg>span::before{content:"";display:block;width:100%;height:8px;background:var(--c)}
.seg>span:first-child::before{border-radius:4px 0 0 4px}.seg>span:last-child::before{border-radius:0 4px 4px 0}.seg>span:only-child::before{border-radius:4px}
.cells8{display:grid;grid-template-columns:repeat(8,14px);gap:2px}
.cells8>span{width:14px;height:14px;border-radius:3px}

/* ── 표 / 칩 / 배지 ── */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{font-weight:600;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--grid);white-space:nowrap;font-size:11.5px;background:var(--surface);position:sticky;top:0;z-index:1}
.t td{padding:8px;border-bottom:1px solid var(--grid);white-space:nowrap}
.t .num{text-align:right}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover,.t tbody tr.click:focus-visible{background:var(--surface-2)}
.t tbody tr[aria-selected="true"]{background:var(--chip-blue)}
.t tfoot td{font-weight:700;border-bottom:none}
.t .sub2{display:block;font-size:11px;color:var(--muted)}
.grade{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;font-weight:800;font-size:12px}
.grade.lg{height:40px;min-width:48px;font-size:21px;border-radius:9px}
.gmove{display:inline-flex;gap:4px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
.badge svg{width:12px;height:12px}
.badge.warn{background:var(--chip-warn);border-color:transparent;color:var(--warn-text)}
.badge.bad{background:var(--chip-bad);border-color:transparent;color:var(--bad-text)}
.badge.good{background:var(--chip-blue);border-color:transparent;color:var(--good-text)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.delta{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.delta.good{color:var(--good-text)}.delta.bad{color:var(--bad-text)}.delta.flat{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{font-style:normal;font-weight:700;color:var(--muted);font-size:11.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.75}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:0 10px;flex:1;min-width:200px;max-width:420px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%}
.toolbar select{height:36px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:0 10px}
.pager{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg-ctl{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}

/* ── 협력사 상세 ── */
.co-head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.co-name{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:-.01em}
.co-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.co-score{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.hero{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1}
.hero small{font-size:16px;color:var(--ink-2);font-weight:600;margin-left:4px;letter-spacing:0}
.gbox{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:700}
.gline{display:flex;align-items:center;gap:8px}
details.more{border-top:1px solid var(--grid);padding-top:10px}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px;margin:10px 0 0}
.dl dt{font-size:11px;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;position:relative}
.flow li:not(:last-child)::after{content:"";position:absolute;left:13px;top:36px;bottom:-8px;width:2px;background:var(--grid)}
.flow .no{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2);position:relative;z-index:1}
.flow li.hl .no{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flow .tt{font-weight:700;font-size:13px}
.flow .ds{font-size:11.5px;color:var(--muted)}
.flow .rv{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.sub-list{display:flex;flex-direction:column;gap:8px}
.sub-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.sub-item .n{font-weight:700;font-size:13px}
.sub-item .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.sub-item .m{font-size:11.5px;color:var(--muted);grid-column:1/-1}

/* ── 툴팁 ── */
#tooltip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 28px rgba(15,23,42,.18);padding:8px 10px;font-size:12px;min-width:120px;max-width:280px}
.tt-title{font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:700}
.tt-row{display:flex;align-items:center;gap:8px;line-height:1.65}
.tt-row strong{font-variant-numeric:tabular-nums;font-size:13px}
.tt-key{width:12px;height:2px;border-radius:1px;flex:none}
.tt-label{color:var(--ink-2)}

/* ── 반응형 ── */
@media (max-width:1320px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis .kpi.key{grid-column:span 3}.atiles{grid-template-columns:repeat(4,minmax(0,1fr))}}

<script>
"use strict";
/* =====================================================================
   1. 설정 — 사내 기준값으로 교체 (등급 구간 · 영역명/배점 · 목표 · 코드 목록)
   ===================================================================== */
const CONFIG = {
  year: 2026, prevYear: 2025,
  grades: ['S','A','B','C','D'],                         // 높은 등급 → 낮은 등급
  gradeCut: { S: 90, A: 80, B: 70, C: 60 },              // 점수 이상(≥), 그 외 D   ※ 예시
  gradeGroup: { S:'우수', A:'우수', B:'보통', C:'개선 필요', D:'개선 필요' },
  areas: [                                                // 2번 파일 영역(T~A). 영역명은 TQRDC 관례로 둔 예시 ※ 사내 명칭으로 교체
    { code:'T', name:'기술', max:15 }, { code:'Q', name:'품질', max:25 }, { code:'R', name:'대응', max:10 }, { code:'D', name:'납기', max:15 },
    { code:'C', name:'원가', max:15 }, { code:'E', name:'환경', max:5 },  { code:'F', name:'재무', max:10 }, { code:'A', name:'기타', max:5 },
  ],
  targets: { avgScore: 80, saRatio: 50, cdLimit: 10 },  // 목표·기준선 ※ 예시 (평균 점수 목표, 우수 비율 목표, 개선 필요 비율 상한)
  orgs: ['A사업부','B사업부','C사업부','D사업부','E사업부'],
  regions: [ {code:'R1',name:'수도권'}, {code:'R2',name:'충청권'}, {code:'R3',name:'영남권'}, {code:'R4',name:'호남권'}, {code:'R5',name:'해외'} ],
  units: ['평가단위 A','평가단위 B','평가단위 C'],
  groups: ['전장','기계가공','사출','프레스','소재','기타'],
  bonusMax: 3,
};

/* 엑셀 컬럼 ↔ 화면 필드 매핑 (opencode 구현 시 이 표 기준으로 파싱)
   1번은 2단 헤더: [평가결과] / [전년도 결과] 그룹으로 같은 이름의 컬럼을 구분 */
const COLUMNS = {
  '1_평가결과': {
    dt:'D/T 코드', code:'협력사 코드', name:'협력사명', confirmed:'협력사 확인', org:'평가조직', regionCode:'권역 코드', region:'권역명',
    inout:'내/외자', unit:'평가단위', subUnitCode:'세부 평가단위 코드', subUnit:'세부 평가단위명', group:'세부업종그룹',
    max:'[평가결과] 배점', genRaw:'[평가결과] 일반항목 평점', gen:'[평가결과] 일반항목 환산점수', bonus:'[평가결과] 가산점',
    score:'[평가결과] 평가 점수', change:'[평가결과] 점수 변동', dtScore:'[평가결과] D/T 종합 점수', grade:'[평가결과] D/T 최종 등급',
    'prev.max':'[전년도 결과] 배점', 'prev.genRaw':'[전년도 결과] 일반항목 평점', 'prev.gen':'[전년도 결과] 일반항목 환산점수',
    'prev.bonus':'[전년도 결과] 가산점', 'prev.score':'[전년도 결과] 평가 점수', 'prev.dtScore':'[전년도 결과] D/T 종합 점수', 'prev.grade':'[전년도 결과] D/T 최종 등급',
  },
  '2_GT상세': {
    generalOrg:'일반 조직', org:'평가조직', gt:'G/T 코드', dt:'D/T 코드', code:'협력사 코드', name:'협력사명', regionCode:'권역 코드', region:'권역명',
    country:'국가', inout:'내/외자', industry:'업종', subUnitCode:'세부 평가단위 코드', subUnit:'세부 평가단위명', main:'주거래', rep:'대표코드',
    size:'기업 규모', mold:'금형', stopPlan:'거래중단예정일', stopDate:'거래중단일',
    max:'배점', genRaw:'일반항목 평점', gen:'일반항목 환산점수', bonus:'가산점', score:'평가 점수', orgGrade:'평가조직 등급',
    dtScore:'D/T 종합 점수', weight:'D/T 등급 반영비중-거래비중', weighted:'D/T 거래비중별 개별합계', weightedSum:'D/T 거래비중별 총합계',
    preGrade:'D/T 조정 전 등급', adjTarget:'등급 조정 대상', grade:'D/T 최종 등급', prevGrade:'D/T 전년도 등급',
    gtScore:'G/T 종합 점수', gtGrade:'G/T 등급', gtWeight:'G/T 등급 반영비중-거래비중',
    area:'{영역}-배점, {영역}-평점, {영역}-환산점수, {영역}-배점(비중), {영역}-평점(비중)  (영역 = T,Q,R,D,C,E,F,A)',
  },
  '3_평가항목': {
    dt:'D/T 코드', code:'협력사 코드', name:'협력사명', org:'평가조직', unit:'평가단위', subUnitCode:'세부 평가단위 코드', subUnit:'세부 평가단위명',
    classType:'분류체계 유형', classCode:'분류체계', itemCode:'평가항목 코드', itemName:'평가항목명',
    max:'배점', raw:'평점', conv:'환산평점', convChange:'환산평점 변동', prevConv:'이전 환산평점', na:'미적용 여부', np:'무실적 여부',
  },
  '4_세부항목': {
    dt:'D/T 코드', code:'협력사 코드', name:'협력사명', org:'평가조직', unit:'평가단위', subUnitCode:'세부 평가단위 코드', subUnit:'세부 평가단위명',
    itemCode:'평가항목 코드', itemName:'평가항목명', owner:'세부 등록 주체', max:'배점', raw:'평점', conv:'환산 평점',
    subCode:'세부항목 코드', subName:'세부항목명', subValue:'세부항목 값',
  },
};

/* =====================================================================
   2. 가상 샘플 데이터 — 실제 구현에서는 엑셀 4종 파싱 결과로 교체
   해석(가정): 배점 = 적용 항목 배점 합(미적용·무실적 제외), 평점 = 득점 합, 환산점수 = 평점 ÷ 배점 × 100,
              평가 점수 = 일반항목 환산점수 + 가산점, D/T 종합 점수 = Σ(평가조직별 평가 점수 × 거래비중)
   ===================================================================== */
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261109);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const pick = (arr, w) => { if (!w) return arr[Math.floor(rnd() * arr.length)]; let x = rnd() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < arr.length; i++) { x -= w[i]; if (x <= 0) return arr[i]; } return arr[arr.length - 1]; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r1 = x => Math.round(x * 10) / 10;
const GI = Object.fromEntries(CONFIG.grades.map((g, i) => [g, i]));   // 0 = 최상위 등급
const gradeOf = v => { const c = CONFIG.gradeCut; return v >= c.S ? 'S' : v >= c.A ? 'A' : v >= c.B ? 'B' : v >= c.C ? 'C' : 'D'; };
const AREA = Object.fromEntries(CONFIG.areas.map(a => [a.code, a]));
const aname = code => `${AREA[code].name}(${code})`;

/* 평가항목 카탈로그 (3번: 분류체계 = 영역 코드, 분류체계 유형 = 정량/정성 ※ 가정) */
const ITEMS = [];
const ITEM_COUNT = { T:3, Q:4, R:2, D:3, C:3, E:2, F:3, A:2 };
for (const a of CONFIG.areas) {
  const n = ITEM_COUNT[a.code];
  for (let k = 1; k <= n; k++) {
    const no = String(k).padStart(2, '0');
    ITEMS.push({ code: a.code + no, name: `${a.name} 평가항목 ${no}`, area: a.code, classType: k % 2 ? '정량' : '정성', max: a.max / n, bias: (rnd() - 0.5) * 0.14 });
  }
}
const AREA_BIAS = { T:0.01, Q:-0.04, R:0.03, D:0, C:-0.02, E:0.05, F:-0.01, A:0.04 };
const ORG_BIAS = Object.fromEntries(CONFIG.orgs.map(o => [o, (rnd() - 0.5) * 0.04]));
const GROUP_BIAS = Object.fromEntries(CONFIG.groups.map(g => [g, (rnd() - 0.5) * 0.05]));
const COUNTRIES = ['중국','베트남','멕시코','인도','미국'];

function scoreFromItems(items, key) {             // key: 'r' 당해 | 'pr' 이전
  let max = 0, raw = 0; const areas = {};
  for (const a of CONFIG.areas) areas[a.code] = { max: 0, raw: 0 };
  items.forEach((it, i) => {
    if (it.na || it.np) return;
    const c = ITEMS[i]; max += c.max; raw += c.max * it[key];
    areas[c.area].max += c.max; areas[c.area].raw += c.max * it[key];
  });
  for (const a of Object.values(areas)) a.conv = a.max ? a.raw / a.max * 100 : null;
  return { max: r1(max), raw: r1(raw), conv: max ? r1(raw / max * 100) : 0, areas };
}

const N = 1248;
const SUP = [];
for (let i = 0; i < N; i++) {
  const region = pick(CONFIG.regions, [32, 20, 26, 10, 12]);
  const foreign = region.code === 'R5';

    dt: `DT${String(3000 + Math.floor(i / 1.6)).padStart(5, '0')}`, gt: `GT${String(500 + Math.floor(i / 4)).padStart(4, '0')}`,
    org, generalOrg: CONFIG.orgs.indexOf(org) < 2 ? '1본부' : '2본부',
    region: region.name, regionCode: region.code, country: foreign ? pick(COUNTRIES) : '한국', inout: foreign || rnd() < 0.03 ? '외자' : '내자',
    unit: CONFIG.units[unitIdx], subUnitCode: subCode, subUnit: `세부단위 ${subCode.slice(2)}`,

/* 굵은 분할 막대 (등급 구성 — 전체를 한눈에, 칸에 비율 표기) */

/* 등급 이동표: 왼쪽 아래 = 상승(파랑), 대각선 = 유지(회색), 오른쪽 위 = 하락(빨강) */
function transMatrix(box, mx) {
  box.replaceChildren();
  const G = CONFIG.grades, max = Math.max(1, ...mx.flat());
  const grid = h('div', { class:'tmx', role:'table', 'aria-label':'전년도 등급 대비 당해 등급 이동표' }, h('div', { class:'h rh' }, '전년 ↓  당해 →'), G.map(g => h('div', { class:'h' }, g)));
  G.forEach((pg, i) => {
    grid.append(h('div', { class:'h rh' }, pg));
    G.forEach((cg, j) => {
      const v = mx[i][j];
      if (!v) { grid.append(h('div', { class:'c muted' }, '·')); return; }
      const ramp = j < i ? P.up : j > i ? P.down : P.same, f = ramp[Math.min(3, Math.floor(Math.sqrt(v / max) * 4))];
      const cell = h('div', { class:'c tn', style:`background:${f};color:${inkOn(f)}` }, fmt.n(v));
      bindTip(cell, () => ({ title:`전년도 ${pg} → 당해 ${cg}`, rows: [{ value:`${fmt.n(v)}개사`, label: j < i ? `${i - j}단계 상승` : j > i ? `${j - i}단계 하락` : '유지' }] }), false);
      grid.append(cell);
    });
  });
  box.append(grid);
}

/* 점수 분포: 막대 색 = 해당 구간의 등급, 회색 선 = 전년도, 점선 = 평균 */
function histogram(box, { bins, prev, mean, mark }) {
  box.replaceChildren();
  const W = width(box, 280), H = 262, m = { l: 34, r: 10, t: 34, b: 52 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxV = niceMax(Math.max(...bins.map(b => b.n), ...prev));
  const band = iw / bins.length, bw = Math.min(24, band * 0.62);
  const y = v => m.t + ih - v / maxV * ih, cx = i => m.l + band * i + band / 2;
  const xOf = v => { const i = bins.findIndex(b => v >= b.lo && v < b.hi); const k = i < 0 ? bins.length - 1 : i; const b = bins[k]; return m.l + band * k + band * clamp((v - b.lo) / (b.hi - b.lo), 0, 1); };
  const svg = s('svg', { width: W, height: H, role:'img', 'aria-label':'D/T 종합 점수 분포' });
  const mx = xOf(mean);
  for (let k = 0; k <= 4; k++) { const v = maxV * k / 4, yy = Math.round(y(v)) + 0.5; svg.append(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: k ? P.grid : P.axis }), text(m.l - 6, yy + 4, fmt.n(v), { anchor:'end', num: true })); }
  bins.forEach((b, i) => {
    const top = y(b.n), f = gradeColor(b.grade);
    svg.append(s('path', { d: roundTop(cx(i) - bw / 2, top, bw, m.t + ih - top, 4), fill: f }));
    if (i) svg.append(text(m.l + band * i, m.t + ih + 15, String(b.lo), { anchor:'middle', num: true }));   // 구간 경계 눈금
    else if (band >= 44) svg.append(text(cx(0), m.t + ih + 15, `${bins[1].lo}↓`, { anchor:'middle', num: true }));
    if (i === mark) { const lx = Math.abs(mx - cx(i)) < 34 ? Math.min(cx(i) + 12, mx - 5) : cx(i) + 12; svg.append(text(lx, top - 8, fmt.n(b.n), { anchor:'end', size: 12, weight: 800, fill: P.ink, num: true }), text(lx, top - 22, '승급 후보', { anchor:'end', size: 11, weight: 700, fill: P.ink2 })); }
    const hit = s('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill:'transparent' });
    bindTip(hit, () => ({ title: b.name, rows: [{ value:`${fmt.n(b.n)}개사`, label:`당해 (${b.grade}등급 구간)`, color: f }, { value:`${fmt.n(prev[i])}개사`, label:'전년도', color: P.prev }] }), false);
    svg.append(hit);
  });
  const pd = prev.map((v, i) => `${i ? 'L' : 'M'}${cx(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  svg.append(s('path', { d: pd, fill:'none', stroke: P.prev, 'stroke-width': 2, 'stroke-linejoin':'round', 'pointer-events':'none' }));
  prev.forEach((v, i) => svg.append(s('circle', { cx: cx(i), cy: y(v), r: 4, fill: P.prev, stroke: P.surface, 'stroke-width': 2, 'pointer-events':'none' })));
  svg.append(s('line', { x1: mx, x2: mx, y1: m.t - 18, y2: m.t + ih, stroke: P.bench, 'stroke-width': 1.5, 'stroke-dasharray':'4 3', 'pointer-events':'none' }), text(mx + 5, m.t - 8, `평균 ${fmt.sc(mean)}`, { size: 11.5, weight: 700, fill: P.ink }));
  // 등급 구간 띠 (기준선 역할)
  const gy = m.t + ih + 26;
  CONFIG.grades.slice().reverse().forEach(g => {
    const idx = bins.map((b, i) => b.grade === g ? i : -1).filter(i => i >= 0); if (!idx.length) return;
    const x0 = m.l + band * idx[0] + 1, x1 = m.l + band * (idx[idx.length - 1] + 1) - 1, f = gradeColor(g);
    svg.append(s('rect', { x: x0, y: gy, width: x1 - x0, height: 16, rx: 4, fill: f }), text((x0 + x1) / 2, gy + 12, x1 - x0 >= 64 ? `${g} ${CONFIG.gradeGroup[g]}` : g, { anchor:'middle', size: 10.5, weight: 800, fill: inkOn(f) }));
  });
  box.append(svg);
}

/* 연도별 추이: 선 + 점선 목표. 빈 점 = 예시 값 */
function trendChart(box, { labels, values, sample = 0, target, fmtV = fmt.sc, name = '' }) {
  box.replaceChildren();
  const W = width(box, 240), H = 230, m = { l: 34, r: 56, t: 16, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = [...values, target ?? values[0]];
  const lo = Math.floor(Math.min(...all) - 2), hi = Math.ceil(Math.max(...all) + 2);
  const x = i => m.l + i * iw / (labels.length - 1), y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  const svg = s('svg', { width: W, height: H, role:'img', 'aria-label': name + ' 연도별 추이' });
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { const yy = Math.round(y(v)) + 0.5; svg.append(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: P.grid }), text(m.l - 6, yy + 4, v, { anchor:'end', num: true })); }
  labels.forEach((l, i) => svg.append(text(x(i), H - 7, l, { anchor:'middle', num: true })));
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  svg.append(s('path', { d: `${d}L${x(values.length - 1)} ${m.t + ih}L${x(0)} ${m.t + ih}Z`, fill: P.accent, 'fill-opacity': 0.10 }), s('path', { d, fill:'none', stroke: P.accent, 'stroke-width': 2, 'stroke-linejoin':'round' }));
  if (target != null) { const ty = y(target); svg.append(s('line', { x1: m.l, x2: W - m.r, y1: ty, y2: ty, stroke: P.bench, 'stroke-width': 1.5, 'stroke-dasharray':'5 4' }), text(m.l + 6, ty - 6, `목표 ${target}`, { size: 11.5, weight: 700, fill: P.ink2 })); }
  values.forEach((v, i) => {
    const isSample = i < sample;
    svg.append(s('circle', { cx: x(i), cy: y(v), r: 4.5, fill: isSample ? P.surface : P.accent, stroke: isSample ? P.accent : P.surface, 'stroke-width': 2 }));
    const hit = s('circle', { cx: x(i), cy: y(v), r: 14, fill:'transparent' });
    bindTip(hit, () => ({ title:`${labels[i]}년${isSample ? ' (예시 값)' : ''}`, rows: [{ value: fmtV(v), label: name, color: P.accent }, ...(target != null ? [{ value: String(target), label:'목표', color: P.bench }] : [])] }));
    svg.append(hit);
  });
  const lx = x(values.length - 1), ly = y(values[values.length - 1]);
  svg.append(text(lx + 9, ly + 5, fmtV(values[values.length - 1]), { size: 13, weight: 800, fill: P.ink, num: true }));
  box.append(svg);
}

/* 영역별 점수 수준 분포 (등급 기준 구간과 같은 색) */

/* 발산 색: 기준(평균) 대비 차이 → 빨강(낮음) · 회색(비슷) · 파랑(높음) */
const divColor = d => P.div[d <= -4 ? 0 : d <= -1.5 ? 1 : d < 1.5 ? 2 : d < 4 ? 3 : 4];
const divLegend = () => h('div', { class:'scale' }, '평균보다', ...[[-5, '4점↓ 낮음'], [-2, '조금 낮음'], [0, '비슷'], [2, '조금 높음'], [5, '4점↑ 높음']].map(([d, t]) => h('span', { class:'lg' }, h('span', { class:'sw', style:`background:${divColor(d)}` }), t)));
function divHeat(box, { rows, cols, values, base, tip }) {
  box.replaceChildren();
  const grid = h('div', { class:'hm', style:`grid-template-columns:auto repeat(${cols.length}, minmax(34px, 1fr))` }, h('div', { class:'h rh' }, ''), cols.map(c => h('div', { class:'h' }, c)));

      card('ov-dim', 4, '권역·업종그룹별 점수', '점선 = 전체 평균 · 누르면 필터 적용', { table: true, tools: dimCtl, src:'권역명, 세부업종그룹, D/T 종합 점수 (1번)' })),
    secHead(4, '조치가 필요한 협력사', '등급 하락 · D등급 · 등급 조정 · 거래중단 예정'),
    h('div', { class:'grid' }, card('ov-act', 12, '조치 대상 목록', '심각한 순 · 행을 누르면 협력사 상세로 이동', { src:'D/T 최종 등급, 전년도 등급, 등급 조정 대상, 거래중단예정일 (1·2번)' })));
}

function kpi({ key, label, ic, value, unit, delta: d, meterEl, bench, action }) {
  return h('div', { class:'kpi' + (key ? ' key' : '') },
    h('div', { class:'kpi-top' }, h('span', { class:'kpi-label' }, icon(ic), label)),
    h('div', { class:'kpi-val' }, value, unit ? h('small', null, unit) : null),
    h('div', { class:'kpi-row' }, d), meterEl || null, bench ? h('div', { class:'kpi-row' }, bench) : null, action || null);
}

function renderOverview(L) {
  const n = L.length, T = CONFIG.targets;
  const avgDt = avg(L, x => x.dtScore), avgPrev = avg(L, x => x.prev.dtScore);
  const gc = countBy(L, x => x.grade), gp = countBy(L, x => x.prev.grade);
  const sa = pctOf((gc.S || 0) + (gc.A || 0), n), saP = pctOf((gp.S || 0) + (gp.A || 0), n);
  const cd = pctOf((gc.C || 0) + (gc.D || 0), n), cdP = pctOf((gp.C || 0) + (gp.D || 0), n);
  const up = L.filter(x => x.move > 0).length, down = L.filter(x => x.move < 0).length, drop2 = L.filter(x => x.move <= -2).length;
  const adj = L.filter(x => x.adjTarget).length, stop = L.filter(x => x.stopPlan).length, check = L.filter(x => x.adjTarget || x.stopPlan).length;
  const areas = CONFIG.areas.map(a => ({ key: a.code, label: aname(a.code), value: areaAvg(L, a.code), prev: areaAvg(L, a.code, 'prevAreas') }));
  const areaMean = avg(areas, a => a.value);
  const weak = [...areas].sort((a, b) => a.value - b.value).filter(a => a.value <= areaMean - 2).slice(0, 3);
  const downReg = Object.entries(countBy(L.filter(x => x.move < 0), x => x.region)).sort((a, b) => b[1] - a[1])[0];
  const near = L.filter(nearA).length;
  setLead(`평가 협력사 ${fmt.n(n)}개사 · 평균 ${fmt.sc(avgDt)}점 (전년 대비 ${fmt.sgn(avgDt - avgPrev)}점) · 우수(S·A) ${fmt.pct(sa)} · 등급 하락 ${fmt.n(down)}개사`);

  // 그래서? — 핵심 인사이트 3개 + 다음 행동
  const gap = T.avgScore - avgDt;
  $('#ov-ins').replaceChildren(
    insight(avgDt >= avgPrev ? 'blue' : 'bad', 'trend', ['평균 D/T 종합 점수 ', h('b', null, `${fmt.sc(avgDt)}점`), `, 전년보다 ${Math.abs(avgDt - avgPrev).toFixed(1)}점 ${avgDt >= avgPrev ? '상승' : '하락'}. `,
      gap > 0 ? ['목표(', String(T.avgScore), '점)까지 ', h('b', null, `${gap.toFixed(1)}점`), ' 남았습니다.'] : '목표를 달성했습니다.'], link('A 승급 후보 보기', () => openList('nearA'))),
    weak.length ? insight('bad', 'warn', [weak.map((a, i) => [i ? '·' : '', h('b', null, `${a.label} ${fmt.sc(a.value)}점`)]), ` 영역이 영역 평균(${fmt.sc(areaMean)})보다 낮습니다. 원인 평가항목을 확인하세요.`], link('분야별 결과에서 보기', () => openArea(weak[0].key)))
      : insight('blue', 'bulb', ['모든 영역이 영역 평균 ±2점 안에 있습니다.']),
    insight('bad', 'down', ['등급 하락 ', h('b', null, `${fmt.n(down)}개사`), `(전체의 ${fmt.pct(pctOf(down, n))})`, drop2 ? [', 이 중 2단계 이상 ', h('b', null, `${fmt.n(drop2)}개사`)] : '', downReg ? [`. ${downReg[0]}이 `, h('b', null, `${fmt.n(downReg[1])}개사`), '로 가장 많습니다.'] : '.'], link('하락 협력사 목록', () => openList('down'))));

  // 핵심 지표 — 가장 중요한 1개 강조 + 모든 지표에 변화와 기준
  $('#ov-kpis').replaceChildren(
    kpi({ key: true, label:'평균 D/T 종합 점수', ic:'gauge', value: fmt.sc(avgDt), unit:'점', delta: delta(avgDt - avgPrev, '점', { suffix:'전년도 대비' }),
      meterEl: meter(avgDt / 100, { tick: T.avgScore / 100, label:`평균 ${fmt.sc(avgDt)}점, 목표 ${T.avgScore}점` }), bench: gap > 0 ? `목표 ${T.avgScore}점 · ${gap.toFixed(1)}점 부족` : `목표 ${T.avgScore}점 달성` }),
    kpi({ label:'우수 등급 (S·A)', ic:'star', value: fmt.pct(sa).replace('%', ''), unit:'%', delta: delta(sa - saP, '%p', { suffix:'전년도 대비' }),
      meterEl: meter(sa / 100, { tick: T.saRatio / 100 }), bench: `목표 ${T.saRatio}% ${sa >= T.saRatio ? '달성' : '미달'}` }),
    kpi({ label:'개선 필요 (C·D)', ic:'warn', value: fmt.pct(cd).replace('%', ''), unit:'%', delta: delta(cd - cdP, '%p', { goodUp: false, suffix:'전년도 대비' }),
      meterEl: meter(cd / 100, { tone:'bad', tick: T.cdLimit / 100 }), bench: `기준 ${T.cdLimit}% 이하 · ${cd <= T.cdLimit ? '충족' : '초과'}` }),
    kpi({ label:'등급 하락', ic:'down', value: fmt.n(down), unit:'개사', delta: h('span', null, `전체의 ${fmt.pct(pctOf(down, n))} · 상승 ${fmt.n(up)}개사`),
      meterEl: meter(down / n, { tone:'bad' }), action: link('하락 목록 보기', () => openList('down')) }),
    kpi({ label:'확인 필요', ic:'adjust', value: fmt.n(check), unit:'개사', delta: h('span', null, `등급 조정 ${fmt.n(adj)} · 거래중단 예정 ${fmt.n(stop)}`),
      action: link('조치 대상 보기', () => { state.act = 'all'; renderAll(); $('#ov-act').scrollIntoView({ behavior:'smooth' }); }) }));

  // ① 등급 구성
  const saD = sa - saP, cdD = cd - cdP;
  legend('ov-grade', [{ color: gradeColor('S'), label:'S·A 우수' }, { color: gradeColor('B'), label:'B 보통' }, { color: gradeColor('D'), label:'C·D 개선 필요' }, { type:'none', label:'· 아래 숫자 = 등급별 협력사 수와 전년 대비 증감' }]);
  segRows(body('ov-grade'), [{ label: String(CONFIG.year), counts: gc, total: n }, { label: String(CONFIG.prevYear), counts: gp, total: n }]);
  body('ov-grade').append(h('div', { class:'gstats' }, CONFIG.grades.map(g => h('div', null,
    h('span', { class:'g' }, gradeChip(g), CONFIG.gradeGroup[g]), h('span', { class:'v tn' }, fmt.n(gc[g] || 0), h('small', { class:'muted', style:'font-size:11px;font-weight:600' }, '개사')),
    delta((gc[g] || 0) - (gp[g] || 0), '개사', { goodUp: GI[g] <= 1, digits: 0 })))));
  body('ov-grade').append(callout(saD > 0 && cdD <= 0 ? 'good' : saD < 0 && cdD > 0 ? 'bad' : '', saD > 0 && cdD <= 0 ? 'trend' : 'info',
    ['우수(S·A) ', h('b', null, fmt.pct(sa)), ` (${fmt.sgn(saD)}%p), 개선 필요(C·D) `, h('b', null, fmt.pct(cd)), ` (${fmt.sgn(cdD)}%p) — `, saD > 0 && cdD <= 0 ? '등급 구성이 전년보다 좋아졌습니다.' : saD < 0 && cdD > 0 ? '등급 구성이 전년보다 나빠졌습니다.' : '등급 구성이 전년과 비슷합니다.']));
  setTable('ov-grade', [{ label:'D/T 최종 등급' }, { label:'당해', num: true }, { label:'비율', num: true }, { label:'전년도', num: true }, { label:'비율', num: true }, { label:'증감', num: true }],
    CONFIG.grades.map(g => [g, fmt.n(gc[g] || 0), fmt.pct(pctOf(gc[g] || 0, n)), fmt.n(gp[g] || 0), fmt.pct(pctOf(gp[g] || 0, n)), fmt.sgn((gc[g] || 0) - (gp[g] || 0), 0)]));

  // ① 등급 변동
  const same = n - up - down;
  const trio = (cls, ic, k, v) => h('div', { class: cls }, h('div', { class:'k' }, ic ? icon(ic) : null, k), h('div', { class:'v' }, fmt.n(v), h('small', null, fmt.pct(pctOf(v, n)))));
  const mx = CONFIG.grades.map(pg => CONFIG.grades.map(cg => L.filter(x => x.prev.grade === pg && x.grade === cg).length));
  body('ov-move').replaceChildren(h('div', { class:'bigtrio' }, trio('up', 'up', '상승', up), trio('', null, '유지', same), trio('down', 'down', '하락', down)), h('div'));
  transMatrix(body('ov-move').lastChild, mx);
  body('ov-move').append(drop2 ? callout('bad', 'warn', ['2단계 이상 하락 ', h('b', null, `${fmt.n(drop2)}개사`), ' — 우선 확인 대상입니다.'], link('명단', () => openList('drop2'))) : callout('', 'info', ['2단계 이상 하락한 협력사는 없습니다.']));

  // ② 점수 분포
  const edges = [0, 55, 60, 65, 70, 75, 80, 85, 90, 95, 100.01];
  const bins = edges.slice(0, -1).map((lo, i) => ({ lo: i ? lo : 50, hi: edges[i + 1], label: i ? String(lo) : '~55', name: i === 0 ? '55점 미만' : i === 9 ? '95~100점' : `${lo}~${edges[i + 1] - 0.1}점`, grade: gradeOf(i ? lo + 2.5 : 50), n: 0 }));
  const binOf = v => { for (let i = edges.length - 2; i >= 0; i--) if (v >= edges[i]) return i; return 0; };
  const prevBins = Array(10).fill(0);
  L.forEach(x => { bins[binOf(x.dtScore)].n++; prevBins[binOf(x.prev.dtScore)]++; });
  const markIdx = bins.findIndex(b => b.lo === CONFIG.gradeCut.A - 5);
  legend('ov-hist', [{ color: gradeColor('A'), label:`${CONFIG.year} (색 = 등급 구간)` }, { type:'line', color: P.prev, label:`${CONFIG.prevYear} 전년도` }, { type:'dash', label:'평균' }]);
  histogram(body('ov-hist'), { bins, prev: prevBins, mean: avgDt, mark: markIdx });
  body('ov-hist').append(callout('good', 'bulb', [`A 기준(${CONFIG.gradeCut.A}점) 바로 아래 ${CONFIG.gradeCut.A - 5}~${CONFIG.gradeCut.A - 0.1}점에 `, h('b', null, `${fmt.n(near)}개사`), ' — 조금만 개선하면 A등급에 들어갑니다.'], link('승급 후보 명단', () => openList('nearA'))));
  setTable('ov-hist', [{ label:'점수 구간' }, { label:'등급 구간' }, { label:'당해', num: true }, { label:'전년도', num: true }], bins.map((b, i) => [b.name, b.grade, fmt.n(b.n), fmt.n(prevBins[i])]));

  // ② 추이 (2022~2024는 예시)
  const years = [CONFIG.year - 4, CONFIG.year - 3, CONFIG.year - 2, CONFIG.prevYear, CONFIG.year].map(String);
  const series = [avgPrev - 2.4, avgPrev - 1.6, avgPrev - 0.7, avgPrev, avgDt];
  legend('ov-trend', [{ type:'line', color: P.accent, label:'평균 점수' }, { type:'dash', label:'목표' }]);
  trendChart(body('ov-trend'), { labels: years, values: series, sample: 3, target: T.avgScore, name:'평균 D/T 종합 점수' });
  body('ov-trend').append(h('p', { class:'note' }, '○ 빈 점(2022~2024)은 예시 값입니다. 연도별 원장을 쌓으면 실제 값으로 표시됩니다.'));
  setTable('ov-trend', [{ label:'연도' }, { label:'평균 D/T 종합 점수', num: true }, { label:'비고' }], years.map((y, i) => [y, fmt.sc(series[i]), i < 3 ? '예시 값' : '']));

  // ③ 평가조직
  const allEv = L.flatMap(x => x.evals.map(e => ({ e, x })));
  const orgBench = avg(allEv, r => r.e.score);
  const orgs = CONFIG.orgs.map(o => { const ev = allEv.filter(r => r.e.org === o); return { key: o, label: o, value: avg(ev, r => r.e.score), n: ev.length }; }).filter(r => r.n).sort((a, b) => b.value - a.value);
  const markLow = (rows, bench, thr) => { const low = rows.reduce((m, r) => r.value < m.value ? r : m, rows[0]); return rows.map(r => ({ ...r, tone: r.value <= bench - thr ? 'bad' : null, tag: r === low && r.value <= bench - thr ? '최저' : null, extra: delta(r.value - bench), tip: [{ value:`${fmt.n(r.n)}개사`, label:'평가 협력사' }] })); };
  const orgRows = markLow(orgs, orgBench, 0.8);
  hbars(body('ov-org'), orgRows, { bench: { value: orgBench, label:`평균 ${fmt.sc(orgBench)}` }, lw: 108, ew: 58, tipLabel:'평균 평가 점수', onClick: r => applyFilter('org', state.filters.org === r.key ? '' : r.key) });
  const lowOrg = orgRows.find(r => r.tag);
  foot('ov-org', lowOrg ? callout('bad', 'warn', [h('b', null, lowOrg.label), ` 평균 ${fmt.sc(lowOrg.value)}점 — 전체보다 ${(orgBench - lowOrg.value).toFixed(1)}점 낮음`]) : h('p', { class:'note' }, '평가조직 간 차이가 크지 않습니다.'));
  setTable('ov-org', [{ label:'평가조직' }, { label:'평균 평가 점수', num: true }, { label:'전체 평균 대비', num: true }, { label:'협력사 수', num: true }], orgs.map(r => [r.label, fmt.sc(r.value), fmt.sgn(r.value - orgBench), fmt.n(r.n)]));

  // ③ 영역
  const areaRows = areas.map(a => ({ ...a, tone: a.value <= areaMean - 2 ? 'bad' : null, tag: weak[0] && a.key === weak[0].key ? '최저' : null, extra: delta(a.value - a.prev), tip: [{ value: fmt.sgn(a.value - a.prev), label:'이전 대비' }] }));
  hbars(body('ov-area'), areaRows, { bench: { value: areaMean, label:`평균 ${fmt.sc(areaMean)}` }, lw: 92, ew: 52, tipLabel:'평균 환산점수', onClick: r => openArea(r.key) });
  foot('ov-area', weak.length ? callout('bad', 'warn', [h('b', null, weak.map(a => a.label).join('·')), ' 보완 필요'], link('원인 항목', () => openArea(weak[0].key))) : null);
  setTable('ov-area', [{ label:'영역' }, { label:'배점', num: true }, { label:'평균 환산점수', num: true }, { label:'이전 대비', num: true }], areas.map(a => [a.label, String(AREA[a.key].max), fmt.sc(a.value), fmt.sgn(a.value - a.prev)]));

  // ③ 권역·업종그룹
  $('#ov-dim .seg-ctl').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.ovDim)));
  const dimKey = state.ovDim, dimList = dimKey === 'region' ? CONFIG.regions.map(r => r.name) : CONFIG.groups;
  const dims = dimList.map(k => { const g = L.filter(x => x[dimKey] === k); return { key: k, label: k, value: avg(g, x => x.dtScore), n: g.length }; }).filter(r => r.n).sort((a, b) => b.value - a.value);
  const dimRows = markLow(dims, avgDt, 0.8);
  hbars(body('ov-dim'), dimRows, { bench: { value: avgDt, label:`평균 ${fmt.sc(avgDt)}` }, lw: 100, ew: 58, tipLabel:'평균 D/T 종합 점수', onClick: r => applyFilter(dimKey, state.filters[dimKey] === r.key ? '' : r.key) });
  const lowDim = dimRows.find(r => r.tag);
  foot('ov-dim', lowDim ? callout('bad', 'warn', [h('b', null, lowDim.label), ` 평균 ${fmt.sc(lowDim.value)}점 — 전체보다 ${(avgDt - lowDim.value).toFixed(1)}점 낮음`]) : h('p', { class:'note' }, '구분 간 차이가 크지 않습니다.'));
  setTable('ov-dim', [{ label: dimKey === 'region' ? '권역명' : '세부업종그룹' }, { label:'평균 D/T 종합 점수', num: true }, { label:'전체 평균 대비', num: true }, { label:'협력사 수', num: true }], dims.map(r => [r.label, fmt.sc(r.value), fmt.sgn(r.value - avgDt), fmt.n(r.n)]));

  // ④ 조치 대상
  const act = ACT[state.act];
  const actList = L.filter(act.f).sort((a, b) => severity(b) - severity(a) || a.dtScore - b.dtScore);
  const chips = chipGroup(Object.entries(ACT).map(([v, o]) => ({ v, label: o.label, n: L.filter(o.f).length })), state.act, v => { state.act = v; renderAll(); }, '조치 대상 분류');
  const csv = h('button', { class:'btn primary', type:'button', onclick: () => downloadCSV(`조치대상_${act.label}.csv`, ['협력사명','협력사 코드','평가조직','D/T 종합 점수','전년도 D/T 종합 점수','전년도 등급','D/T 최종 등급','등급 조정 대상','거래중단예정일'],
    actList.map(x => [x.name, x.code, x.org, fmt.sc(x.dtScore), fmt.sc(x.prev.dtScore), x.prev.grade, x.grade, x.adjTarget ? 'Y' : 'N', x.stopPlan || ''])) }, icon('download'), `내려받기 (${fmt.n(actList.length)}개사)`);
  const top = actList.slice(0, 8);
  body('ov-act').replaceChildren(h('div', { class:'toolbar', style:'justify-content:space-between' }, chips, csv),
    top.length ? h('div', { class:'tw' }, simpleTable([{ label:'협력사' }, { label:'평가조직' }, { label:'D/T 종합 점수', num: true }, { label:'전년 대비', num: true }, { label:'등급 (전년 → 당해)' }, { label:'사유' }],
      top.map(x => [nameCell(x), x.org, fmt.sc(x.dtScore), delta(x.dtScore - x.prev.dtScore), gmove(x.prev.grade, x.grade), reasons(x)]), { onRow: i => openCompany(top[i].code) }))
      : h('p', { class:'note' }, '해당하는 협력사가 없습니다.'));
  foot('ov-act', h('span', { class:'note' }, `상위 ${top.length}개사 표시 · 전체 ${fmt.n(actList.length)}개사`), link('협력사 목록에서 전체 보기', () => openList(state.act === 'all' ? 'down' : state.act in LIST ? state.act : 'all')));
}

/* =====================================================================
   7. 분야별 결과 — 영역 비교 → 선택 영역의 평가항목·하위 협력사
   ===================================================================== */
const BANDS = [{ g:'S', name:'90점 이상' }, { g:'A', name:'80~89.9점' }, { g:'B', name:'70~79.9점' }, { g:'C', name:'60~69.9점' }, { g:'D', name:'60점 미만' }];
function buildArea() {
  $('#page-area').replaceChildren(
    h('div', { class:'insights', id:'ar-ins' }),
    h('div', { class:'atiles', id:'ar-tiles', role:'group', 'aria-label':'영역 선택' }),
    secHead(1, '영역 비교', '영역마다 점수가 낮은 협력사가 얼마나 있나'),

  const at = list.findIndex(o => o.code === x.code);

  $('#co-head').replaceChildren(h('div', { class:'sec-h', style:'justify-content:space-between' },
    h('div', { style:'display:flex;gap:10px;align-items:baseline;flex-wrap:wrap' }, h('span', { class:'no' }, '2'), h('h2', null, `협력사 상세 — ${x.name}`), h('p', null, `${x.code} · 목록 ${at < 0 ? '밖' : `${at + 1}번째`}`)),
    h('div', { class:'tools' }, nav('‹ 이전 협력사', -1), nav('다음 협력사 ›', 1))));

  const diffs = CONFIG.areas.map((a, j) => ({ a, v: x.areas[a.code].conv, d: x.areas[a.code].conv == null ? null : x.areas[a.code].conv - base[j] })).filter(r => r.d != null);
  const weakA = diffs.reduce((m, r) => r.d < m.d ? r : m, diffs[0]), strongA = diffs.reduce((m, r) => r.d > m.d ? r : m, diffs[0]);
  const moveTxt = x.move < 0 ? `전년 ${x.prev.grade}등급에서 ${-x.move}단계 하락했습니다. ` : x.move > 0 ? `전년 ${x.prev.grade}등급에서 ${x.move}단계 상승했습니다. ` : '전년과 같은 등급입니다. ';
  const tone = x.move < 0 || GI[x.grade] >= 3 ? 'bad' : x.move > 0 ? 'good' : '';
  const rank = rankOf.get(x.code) || SUP.filter(o => o.dtScore > x.dtScore).length + 1;
  const field = (k, v) => h('div', null, h('dt', null, k), h('dd', { title: String(v) }, v));
  body('co-sum').replaceChildren(h('div', { class:'co-head' },
    h('div', { style:'display:flex;flex-direction:column;gap:10px;min-width:0' },
      h('div', { class:'co-name' }, x.name, badge(CONFIG.gradeGroup[x.grade], GI[x.grade] <= 1 ? 'good' : GI[x.grade] >= 3 ? 'bad' : ''),
        x.adjTarget ? badge('등급 조정 대상', 'warn', 'adjust') : null, x.stopPlan ? badge(`거래중단 예정 ${x.stopPlan}`, 'bad', 'stop') : null,
        x.confirmed === 'N' ? badge('협력사 확인 N', 'warn', 'warn') : badge('협력사 확인 Y')),
      h('div', { class:'co-meta' }, [x.org + (x.evals.length > 1 ? ` 외 ${x.evals.length - 1}곳` : ''), `${x.region} · ${x.country}`, `${x.group} · ${x.industry}`, x.size, x.inout, `주거래 ${x.main}`, `금형 ${x.mold}`].map(t => badge(t))),
      callout(tone, tone === 'bad' ? 'warn' : 'bulb', [h('b', null, x.name), '은(는) D/T 종합 점수 ', h('b', null, `${fmt.sc(x.dtScore)}점`), '으로 ', h('b', null, `${x.grade}등급(${CONFIG.gradeGroup[x.grade]})`), '입니다. ', moveTxt,
        weakA.d <= -1 ? ['가장 약한 영역은 ', h('b', null, `${aname(weakA.a.code)} ${fmt.sc(weakA.v)}점`), `(평균 대비 ${fmt.sgn(weakA.d)})`] : weakA.d >= 1 ? '모든 영역이 평균보다 높고' : '영역 점수가 대체로 평균 수준이고',
        strongA.d >= 1 ? [', 가장 강한 영역은 ', h('b', null, `${aname(strongA.a.code)} ${fmt.sc(strongA.v)}점`), `(평균 대비 ${fmt.sgn(strongA.d)})입니다.`] : ' 두드러진 강점 영역은 없습니다.']),
      h('details', { class:'more' }, h('summary', null, '기본 정보 (코드 · 조직)'), h('dl', { class:'dl' },
        field('협력사 코드', x.code), field('대표코드', x.rep), field('D/T 코드', x.dt), field('G/T 코드', x.gt), field('일반 조직', x.generalOrg), field('평가단위', x.unit),
        field('세부 평가단위', `${x.subUnit} (${x.subUnitCode})`), field('권역 코드', x.regionCode), field('거래중단예정일', x.stopPlan || '–'), field('거래중단일', x.stopDate || '–'), field('협력사 확인', x.confirmed), field('평가조직', x.evals.map(e => e.org).join(', '))))),
    h('div', { style:'display:flex;flex-direction:column;gap:8px' },
      h('div', { class:'co-score' }, h('div', { class:'gbox' }, 'D/T 종합 점수', h('div', { class:'hero' }, fmt.sc(x.dtScore), h('small', null, '점'))),
        h('div', { class:'gbox' }, 'D/T 최종 등급', gradeChip(x.grade, true)), h('div', { class:'gbox' }, '전년도', gradeChip(x.prev.grade, true)), h('div', { class:'gbox' }, 'G/T 등급', gradeChip(x.gtGrade, true))),
      h('div', { class:'kpi-row' }, delta(x.dtScore - x.prev.dtScore, '점', { suffix:`전년도 ${fmt.sc(x.prev.dtScore)}점 대비` })),
      meter(x.dtScore / 100, { tone: GI[x.grade] >= 3 ? 'bad' : '', tick: CONFIG.gradeCut.A / 100, label:`D/T 종합 점수 ${fmt.sc(x.dtScore)}, A등급 기준 ${CONFIG.gradeCut.A}` }),
      h('div', { class:'kpi-row' }, `세로선 = A등급 기준 ${CONFIG.gradeCut.A}점 · ${x.dtScore >= CONFIG.gradeCut.A ? 'A 기준 이상' : `A 기준까지 ${(CONFIG.gradeCut.A - x.dtScore).toFixed(1)}점`}`),
      h('div', { class:'kpi-row' }, `순위 ${fmt.n(rank)}위 / ${fmt.n(L.length)}개사 · G/T 종합 점수 ${fmt.sc(x.gtScore)}`),
      h('div', { class:'kpi-row' }, `평가 점수 ${fmt.sc(x.score)} = 일반항목 환산점수 ${fmt.sc(x.gen)} + 가산점 ${fmt.sc(x.bonus)}`))));
  const itemAvg = ITEMS.map((c, i) => { const v = L.filter(o => !o.items[i].na && !o.items[i].np); return avg(v, o => o.items[i].r * 100); });
  foot('co-sum', h('span', { class:'note' }, '평가항목·세부항목은 아래에서 확인하세요.'),
    h('button', { class:'btn primary sm', type:'button', onclick: () => downloadCSV(`${x.name}_평가항목.csv`, ['영역','평가항목 코드','평가항목명','분류체계 유형','배점','평점','환산평점','전체 평균','이전 환산평점','미적용 여부','무실적 여부'],
      ITEMS.map((c, i) => { const it = x.items[i], off = it.na || it.np; return [aname(c.area), c.code, c.name, c.classType, fmt.sc(c.max), off ? '' : fmt.sc(c.max * it.r), off ? '' : fmt.sc(it.r * 100), fmt.sc(itemAvg[i]), fmt.sc(it.pr * 100), it.na ? 'Y' : 'N', it.np ? 'Y' : 'N']; })) }, icon('download'), '이 협력사 평가항목 내려받기'));

  // 영역별 점수 vs 평균 (불릿)
  legend('co-areas', [{ color: P.ctx, label:'이 협력사' }, { type:'tick', label:'전체 평균' }, { color: P.bad, label:'평균보다 5점 이상 낮음' }, { color: P.accent, label:'가장 강한 영역' }]);
  hbars(body('co-areas'), diffs.map(r => ({ key: r.a.code, label: aname(r.a.code), value: r.v, tick: base[CONFIG.areas.indexOf(r.a)], tickLabel:'전체 평균',
    tone: r.d <= -5 ? 'bad' : r === strongA && r.d >= 5 ? 'key' : null, tag: r === weakA && r.d <= -3 ? '약점' : r === strongA && r.d >= 3 ? '강점' : null, tagKind: r === strongA ? 'good' : 'bad', extra: delta(r.d) })), { lw: 96, ew: 56, tipLabel:'이 협력사' });
  setTable('co-areas', [{ label:'영역' }, { label:'배점', num: true }, { label:'이 협력사', num: true }, { label:'전체 평균', num: true }, { label:'차이', num: true }], diffs.map(r => [aname(r.a.code), String(r.a.max), fmt.sc(r.v), fmt.sc(r.v - r.d), fmt.sgn(r.d)]));

  // 등급 산출 과정
  const step = (no, tt, ds, rv, hl) => h('li', { class: hl ? 'hl' : null }, h('span', { class:'no' }, no), h('div', { style:'min-width:0' }, h('div', { class:'tt' }, tt), h('div', { class:'ds' }, ds)), h('div', { class:'rv' }, rv));
  body('co-flow').replaceChildren(h('ol', { class:'flow' },
    step(1, '평가조직별 평가', x.evals.map(e => `${e.org} ${fmt.sc(e.score)}점 (${e.grade})`).join(' · '), x.evals.map(e => gradeChip(e.grade))),
    step(2, '거래비중 반영', x.evals.map(e => `${e.org} ${fmt.pct(e.weight)}`).join(' + ') + ' = 100%', `Σ ${fmt.sc(sum(x.evals, e => e.weighted))}`),
    step(3, 'D/T 종합 점수', 'D/T 거래비중별 총합계', `${fmt.sc(x.dtScore)}점`),

  const IC = { all:['전체', () => true], low:['평균보다 5점 이상 낮음', r => !r.off && r.d <= -5], off:['미적용·무실적', r => r.off] };
  if (state.coItem == null) state.coItem = rowsAll.filter(r => !r.off).reduce((m, r) => r.d < m.d ? r : m, rowsAll.find(r => !r.off) || rowsAll[0]).i;
  const shown = rowsAll.filter(IC[state.coItemChip][1]);
  body('co-items').replaceChildren(

      shown.map(r => [aname(r.c.area), h('span', null, h('b', null, r.c.name), h('span', { class:'sub2' }, r.c.code)), r.c.classType, fmt.sc(r.c.max), r.off ? '–' : fmt.sc(r.c.max * r.it.r),
        r.off ? '–' : mcell(r.it.r, fmt.sc(r.it.r * 100), { tone: r.d <= -5 ? 'bad' : 'ctx', tick: itemAvg[r.i] / 100 }), r.off ? '–' : delta(r.d), r.off ? '–' : delta((r.it.r - r.it.pr) * 100),
        r.it.na ? badge('미적용') : r.it.np ? badge('무실적') : '']),
      { onRow: k => { state.coItem = shown[k].i; renderAll(); }, selected: shown.findIndex(r => r.i === state.coItem) })));
  foot('co-items', h('span', { class:'note' }, '환산평점 막대의 세로선 = 전체 평균'));

  const ci = ITEMS[state.coItem], cit = x.items[state.coItem], off = cit.na || cit.np;

  const subs = (() => { const r = mulberry32(x.idx * 131 + state.coItem * 7 + 1), k = 2 + Math.floor(r() * 3); return Array.from({ length: k }, (_, j) => { const t = Math.floor(r() * 4); return { code:`${ci.code}-${j + 1}`, name:`세부항목 ${ci.code}-${j + 1}`, value: t === 0 ? `${(80 + r() * 20).toFixed(1)}%` : t === 1 ? `${Math.floor(r() * 5)}건` : t === 2 ? `${(1 + r() * 9).toFixed(1)}일` : (r() < 0.85 ? 'Y' : 'N'), owner: ['협력사','평가조직','시스템'][Math.floor(r() * 3)] }; }); })();

/* =====================================================================
   9. 화면 전환 · 필터 · 테마 · 초기화
   ===================================================================== */
const PAGES = ['overview', 'area', 'company'];
const TITLES = { overview:'전체 결과', area:'분야별 결과', company:'협력사별 결과' };
const BUILT = {}, BUILDERS = { overview: buildOverview, area: buildArea, company: buildCompany }, RENDERERS = { overview: renderOverview, area: renderArea, company: renderCompany };
function route() {
  const p = (location.hash || '#overview').slice(1), next = PAGES.includes(p) ? p : 'overview';
  if (next !== state.page) window.scrollTo(0, 0);
  state.page = next;
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.page === next) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#page-title').textContent = TITLES[next];
  document.title = `${TITLES[next]} · 협력사 종합평가`;
  renderAll();
}
function resetFilters() { Object.keys(state.filters).forEach(k => { state.filters[k] = ''; const el = $('#f-' + k); if (el) el.value = ''; }); state.area = null; renderAll(); }
function renderActiveFilters() {
  const on = Object.entries(state.filters).filter(([, v]) => v);
  $('#active-f').replaceChildren(...(on.length ? [h('span', null, '적용 중인 필터'), ...on.map(([k, v]) => h('button', { class:'fchip', type:'button', 'aria-label':`${FILTER_LABEL[k]} ${v} 필터 해제`, onclick: () => applyFilter(k, '') }, `${FILTER_LABEL[k]} `, h('b', null, v), ' ✕')), h('button', { class:'link', type:'button', onclick: resetFilters }, '모두 해제')] : []));
}
function renderAll() {
  hideTip(); renderActiveFilters();
  const L = filtered(), empty = L.length === 0;
  $('#empty').hidden = !empty;
  PAGES.forEach(k => { $('#page-' + k).hidden = empty || k !== state.page; });
  if (empty) { setLead('조건에 맞는 협력사가 없습니다.'); return; }
  if (!BUILT[state.page]) { BUILDERS[state.page](); BUILT[state.page] = true; }
  RENDERERS[state.page](L);
}
function fillSelect(id, values) { $('#' + id).replaceChildren(h('option', { value:'' }, '전체'), ...values.map(v => h('option', { value: v }, v))); }
fillSelect('f-org', CONFIG.orgs); fillSelect('f-region', CONFIG.regions.map(r => r.name)); fillSelect('f-inout', ['내자', '외자']);
fillSelect('f-unit', CONFIG.units); fillSelect('f-group', CONFIG.groups); fillSelect('f-grade', CONFIG.grades);
Object.keys(state.filters).forEach(k => $('#f-' + k).addEventListener('change', e => { state.filters[k] = e.target.value; if (k !== 'grade') state.area = null; renderAll(); }));

/* 기본은 라이트(참고 디자인과 동일), 버튼으로 다크 전환 — 다크 색은 별도 검증값 */
function applyTheme(t) {
  document.documentElement.dataset.theme = t; P = PALETTE[t];
  const b = $('#theme-btn'); b.setAttribute('aria-pressed', String(t === 'dark')); b.textContent = t === 'dark' ? '라이트 모드' : '다크 모드';
}
$('#theme-btn').addEventListener('click', () => {
  const t = P === PALETTE.dark ? 'light' : 'dark'; applyTheme(t);
  try { localStorage.setItem('supplier-dash-theme', t); } catch (e) { /* 저장 불가 환경 무시 */ }
  renderAll();
});
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('supplier-dash-theme') === 'dark' ? 'dark' : 'light'; } catch (e) { /* 무시 */ }
applyTheme(savedTheme);

let lastW = 0, rTimer;
new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if (w === lastW) return; lastW = w; clearTimeout(rTimer); rTimer = setTimeout(renderAll, 120); }).observe($('.main'));
window.addEventListener('hashchange', route);
route();
</script>
